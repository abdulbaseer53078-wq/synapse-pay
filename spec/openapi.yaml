openapi: 3.1.0
info:
  title: Synapse Pay API
  version: 1.0.0
  description: >-
    Frozen at v1.0.0. Any change to this contract goes through a versioned
    breaking-change process (e.g. a /v2 endpoint).
servers:
  - url: /api
# Merchant backends use OAuth2; terminals use mTLS. Either satisfies a request.
security:
  - OAuth2ClientCredentials: [transactions:write]
  - MutualTLS: []
webhooks:
  transactionStatus:
    post:
      operationId: transactionStatusWebhook
      summary: Final transaction status, sent to the request's webhook_url
      description: >-
        Signed with HMAC-SHA256 instead of OAuth/mTLS. The per-merchant secret is
        provisioned at merchant onboarding; the merchant record's webhook_secret_id
        (Terminal Registry) selects which secret signs. Receivers must verify the
        signature over the raw body bytes, before parsing, using a constant-time compare.
      security: []
      parameters:
        - name: X-Signature
          in: header
          required: true
          description: Lowercase hex HMAC-SHA256 of the raw request body, keyed with the merchant's webhook secret.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionResponse'
      responses:
        2XX:
          description: Receipt acknowledged.
paths:
  /v1/transactions:
    post:
      operationId: createTransaction
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            examples:
              card: { $ref: '#/components/examples/CardRequest' }
              upi: { $ref: '#/components/examples/UpiRequest' }
              wallet: { $ref: '#/components/examples/WalletRequest' }
              qr: { $ref: '#/components/examples/QrRequest' }
              offline: { $ref: '#/components/examples/OfflineRequest' }
      responses:
        '201':
          description: >-
            Transaction created. A retry with the same idempotency_key returns this
            same body without reprocessing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                card_success: { $ref: '#/components/examples/CardSuccess' }
                card_failure: { $ref: '#/components/examples/CardFailure' }
                upi_success: { $ref: '#/components/examples/UpiSuccess' }
                upi_failure: { $ref: '#/components/examples/UpiFailure' }
                wallet_success: { $ref: '#/components/examples/WalletSuccess' }
                wallet_failure: { $ref: '#/components/examples/WalletFailure' }
                qr_success: { $ref: '#/components/examples/QrSuccess' }
                qr_failure: { $ref: '#/components/examples/QrFailure' }
                offline_success: { $ref: '#/components/examples/OfflineSuccess' }
                offline_failure: { $ref: '#/components/examples/OfflineFailure' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/capabilities/{payment_method}:
    get:
      operationId: getCapabilities
      summary: Get the static capability descriptor for a payment method
      description: >-
        Static; the merchant SDK fetches each descriptor once at startup and caches it.
        For a QR transaction, use the descriptor of its qr_encoded_rail (UPI, CARD or
        WALLET); the QR descriptor applies only when the rail is UNKNOWN.
      security:
        - OAuth2ClientCredentials: [transactions:read]
        - MutualTLS: []
      parameters:
        - name: payment_method
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TransactionRequest/properties/payment_method' }
      responses:
        '200':
          description: The descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDescriptor'
              examples:
                card: { $ref: '#/components/examples/CardCapabilities' }
                upi: { $ref: '#/components/examples/UpiCapabilities' }
                wallet: { $ref: '#/components/examples/WalletCapabilities' }
                qr: { $ref: '#/components/examples/QrCapabilities' }
                offline: { $ref: '#/components/examples/OfflineCapabilities' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    # Merchant SDK / merchant backend → cloud API.
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes:
            transactions:write: Initiate and manage transactions
            transactions:read: Read transaction status and history
            registry:read: Read terminal registry entries
            registry:write: Register and update terminals
    # Terminal → cloud (T2C).
    MutualTLS:
      type: mutualTLS
      description: >-
        The terminal presents an X.509 client certificate issued at registration in the
        Terminal Registry. The cloud validates the chain and checks the certificate's
        terminal against the registry; a request whose terminal_id differs from the
        certificate's terminal is rejected with 403.
  responses:
    Error:
      description: >-
        The request was rejected before a transaction was created (400 invalid body,
        401 not authenticated, 403 missing scope or terminal_id not matching the client
        certificate, 409 idempotency_key reused with a different body, 422 unknown
        terminal or merchant, 5XX server error). Declines are not errors here: they
        return 201 with status FAILED and the error inside the transaction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_request:
              value:
                error_code: INVALID_REQUEST
                error_message: "amount: must be a positive integer"
                error_category: VALIDATION_ERROR
                retryable: false
            idempotency_conflict:
              value:
                error_code: IDEMPOTENCY_KEY_CONFLICT
                error_message: idempotency_key was already used with a different request body
                error_category: VALIDATION_ERROR
                retryable: false
  # Fixtures for adapter developers, contract tests and SDK docs. Each response echoes its request.
  examples:
    CardRequest:
      value:
        idempotency_key: 0b8e6c1a-4f2d-4a9e-8c3b-1d2e3f4a5b6c
        amount: 50000
        currency: INR
        payment_method: CARD
