    QrFailure:
      value:
        transaction_id: txn_01JC8Z4C5D6E7F8G9H0J1K2L3N
        idempotency_key: 3e1b9f4d-7c5a-4d2b-9f6e-4a5b6c7d8e9f
        status: FAILED
