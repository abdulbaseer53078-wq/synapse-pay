openapi: 3.1.0
info:
  title: Synapse Pay API
  version: 1.12.0
  description: >-
    v1 was frozen at 1.0.0: later 1.x versions only add to it. Any breaking change
    goes through a versioned process (e.g. a /v2 endpoint). 1.1.0 adds terminal registration, transaction-time authorization and the registry query API. 1.2.0 adds the optional CardDetails.pin_block and documents the card data envelope. 1.3.0 adds payment intents (merchant SDKs), terminal checkout, and payment_intent_id on transactions. 1.11.0 adds the optional CardDetails.emv_data (chip data, sent as DE 55) and certification test runs, which gate createCertification. 1.12.0 adds saved cards: POST/DELETE /v1/card-tokens and CardDetails.card_token.
servers:
  - url: /api
# Merchant backends use OAuth2; terminals use mTLS. Either satisfies a request.
security:
  - OAuth2ClientCredentials: [transactions:write]
  - MutualTLS: []
webhooks:
  transactionStatus:
    post:
      operationId: transactionStatusWebhook
      summary: Final transaction status, sent to the request's webhook_url
      description: >-
        Signed with HMAC-SHA256 instead of OAuth/mTLS. The per-merchant secret is
        provisioned at merchant onboarding; the merchant record's webhook_secret_id
        (Terminal Registry) selects which secret signs. Receivers must verify the
        signature over the raw body bytes, before parsing, using a constant-time compare.
      security: []
      parameters:
        - name: X-Signature
          in: header
          required: true
          description: Lowercase hex HMAC-SHA256 of the raw request body, keyed with the merchant's webhook secret.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionResponse'
      responses:
        2XX:
          description: Receipt acknowledged.
paths:
  /v1/transactions:
    post:
      operationId: createTransaction
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            examples:
              card: { $ref: '#/components/examples/CardRequest' }
              upi: { $ref: '#/components/examples/UpiRequest' }
              wallet: { $ref: '#/components/examples/WalletRequest' }
              qr: { $ref: '#/components/examples/QrRequest' }
              offline: { $ref: '#/components/examples/OfflineRequest' }
      responses:
        '201':
          description: >-
            Transaction created. A retry with the same idempotency_key returns this
            same body without reprocessing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                card_success: { $ref: '#/components/examples/CardSuccess' }
                card_failure: { $ref: '#/components/examples/CardFailure' }
                upi_success: { $ref: '#/components/examples/UpiSuccess' }
                upi_failure: { $ref: '#/components/examples/UpiFailure' }
                wallet_success: { $ref: '#/components/examples/WalletSuccess' }
                wallet_failure: { $ref: '#/components/examples/WalletFailure' }
                qr_success: { $ref: '#/components/examples/QrSuccess' }
                qr_failure: { $ref: '#/components/examples/QrFailure' }
                offline_success: { $ref: '#/components/examples/OfflineSuccess' }
                offline_failure: { $ref: '#/components/examples/OfflineFailure' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/capabilities/{payment_method}:
    get:
      operationId: getCapabilities
      summary: Get the static capability descriptor for a payment method
      description: >-
        Static; the merchant SDK fetches each descriptor once at startup and caches it.
        For a QR transaction, use the descriptor of its qr_encoded_rail (UPI, CARD or
        WALLET); the QR descriptor applies only when the rail is UNKNOWN.
      security:
        - OAuth2ClientCredentials: [transactions:read]
        - MutualTLS: []
      parameters:
        - name: payment_method
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TransactionRequest/properties/payment_method' }
      responses:
        '200':
          description: The descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDescriptor'
              examples:
                card: { $ref: '#/components/examples/CardCapabilities' }
                upi: { $ref: '#/components/examples/UpiCapabilities' }
                wallet: { $ref: '#/components/examples/WalletCapabilities' }
                qr: { $ref: '#/components/examples/QrCapabilities' }
                offline: { $ref: '#/components/examples/OfflineCapabilities' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  # Query and management. Merchants see only their own terminals (others' return 404); registry:admin may
  # act on any merchant's, and every such admin access is recorded in the audit log.
  # Payment intents (1.3.0): the merchant's server fixes the amount with its secret key; the customer's browser
  # or app pays it with the intent's client_secret, entering the card in Synapse's own card form.
  /v1/payment_intents:
    post:
      operationId: createPaymentIntent
      summary: Create a payment intent (merchant server)
      description: >-
        Same idempotency_key and body returns the same intent (200); a different body is a 409. Give the
        client_secret to the customer's page or app. With terminal_id, the intent is paid on that terminal.
      security:
        - SecretKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentIntentRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '200':
          description: Already created with this idempotency_key and body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/payment_intents/{payment_intent_id}:
    get:
      operationId: getPaymentIntent
      summary: Retrieve a payment intent
      description: >-
        With the secret key, the whole intent. With ?client_secret (no other credentials), the view a customer's
        page may see: no client_secret, metadata, description or webhook_url.
      security:
        - SecretKey: []
        - {}
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - name: client_secret
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The intent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/payment_intents/{payment_intent_id}/cancel:
    post:
      operationId: cancelPaymentIntent
      summary: Cancel a payment intent that's still waiting for the customer
      security:
        - SecretKey: []
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
      responses:
        '200':
          description: Canceled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/payment_intents/{payment_intent_id}/confirm:
    post:
      operationId: confirmPaymentIntent
      summary: Pay a payment intent with a card (customer's card form, client_secret)
      description: >-
        Called by Synapse's card frame or mobile SDK, never by merchant code. Runs 3-D Secure; when the issuer
        asks the cardholder, the intent comes back REQUIRES_ACTION with next_action. Safe to repeat: an intent
        that isn't REQUIRES_PAYMENT_METHOD is returned as it is, never charged again. A declined card returns the
        intent to REQUIRES_PAYMENT_METHOD with last_payment_error, so the customer can try another card.
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPaymentIntentRequest' }
      responses:
        '200':
          description: The intent after this attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/checkout/key:
    get:
      operationId: getCheckoutKey
      summary: The HSM's public checkout key (JWK, EC P-256) that card forms encrypt card data to
      security: [{}]
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                type: object
                required: [kty, crv, x, y]
                properties:
                  kty: { const: EC }
                  crv: { const: P-256 }
                  x: { type: string }
                  y: { type: string }
        4XX: { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/merchants/me/recovery-stats:
    get:
      operationId: getRecoveryStats
      summary: Payments a backup acquirer saved (merchant server)
      description: >-
        Counted from the audit trail: a payment is cascaded when it was tried on more than one acquirer, and
        recovered when a backup approved it. Only the calling merchant's payments.
      security:
        - SecretKey: []
      parameters:
        - name: days
          in: query
          description: Window, counted back from now.
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: The stats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryStats' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/certifications:
    post:
      operationId: createCertification
      summary: Record a scheme certification for one exact firmware (platform admin)
      description: >-
        Since 1.10.0. One row per device model, exact firmware version, scheme and acquirer: there are no
        wildcards, because a patch release voids certification until it is re-tested. Takes effect on the next
        transaction-time authorization; audited. Since 1.11.0, 409 CERTIFICATION_RUN_REQUIRED unless the
        latest certification test run for the firmware passed this scheme (recordCertificationRun).
      security: [{ OAuth2ClientCredentials: [registry:admin] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCertificationRequest' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    get:
      operationId: listCertifications
      summary: The certification matrix (platform admin)
      security: [{ OAuth2ClientCredentials: [registry:admin] }]
      parameters:
        - { name: device_model, in: query, schema: { type: string, maxLength: 64 } }
        - { name: firmware_version, in: query, schema: { type: string, maxLength: 32 } }
      responses:
        '200':
          description: Matching certifications.
          content:
            application/json:
              schema:
                type: object
                required: [certifications]
                properties:
                  certifications: { type: array, items: { $ref: '#/components/schemas/Certification' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/certification-runs:
    post:
      operationId: recordCertificationRun
      summary: Record a certification test harness run for one exact firmware
      description: >-
        Since 1.11.0. Recording a run approves nothing. createCertification answers 409
        CERTIFICATION_RUN_REQUIRED unless the latest run for that device model and firmware passed and covered
        the scheme, so a regression found after a pass blocks approval. `passed` is derived from the report's
        cases, never taken from the caller. Reports carry the PAN masked and chip data as tags and lengths only.
        Audited.
      security: [{ OAuth2ClientCredentials: ['certification:run'] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_model, firmware_version, driver, report]
              properties:
                device_model: { type: string, minLength: 1, maxLength: 64 }
                firmware_version: { type: string, minLength: 1, maxLength: 32, examples: ['2.6.0'] }
                driver: { type: string, minLength: 1, maxLength: 64, description: "What drove the terminal: software or a device driver." }
                report:
                  type: object
                  description: The harness report (certification/harness.py). Fields beyond these are stored as given.
                  required: [cases]
                  properties:
                    cases:
                      type: array
                      maxItems: 500
                      items:
                        type: object
                        required: [id, scheme, passed]
                        properties:
                          id: { type: string, minLength: 1, maxLength: 64 }
                          scheme: { type: string, enum: [VISA, MASTERCARD, RUPAY, AMEX, NPCI_UPI] }
                          passed: { type: boolean }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, device_model, firmware_version, driver, passed, schemes, recorded_at]
                properties:
                  run_id: { type: string, format: uuid }
                  device_model: { type: string }
                  firmware_version: { type: string }
                  driver: { type: string }
                  passed: { type: boolean, description: "True only if the report has cases and every one passed." }
                  schemes: { type: array, items: { type: string } }
                  recorded_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/certifications/{certification_id}:
    patch:
      operationId: updateCertification
      summary: Suspend, reactivate or re-date a certification (platform admin)
      description: Since 1.10.0. A suspended or expired certification authorizes nothing; audited.
      security: [{ OAuth2ClientCredentials: [registry:admin] }]
      parameters:
        - { name: certification_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [ACTIVE, SUSPENDED] }
                valid_until: { type: string, format: date-time }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/device-models/{device_model}/minimum-firmware:
    put:
      operationId: setMinimumFirmware
      summary: Set a model's minimum secure firmware (platform admin)
      description: >-
        Since 1.10.0. Older firmware is refused even where certified, and a heartbeat reporting a change to it
        suspends the terminal (reason FIRMWARE_DOWNGRADE). Audited.
      security: [{ OAuth2ClientCredentials: [registry:admin] }]
      parameters:
        - { name: device_model, in: path, required: true, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [minimum_secure_firmware]
              properties:
                minimum_secure_firmware: { type: string, maxLength: 32, examples: ['2.4.1'] }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                type: object
                required: [device_model, minimum_secure_firmware]
                properties:
                  device_model: { type: string }
                  minimum_secure_firmware: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/card-tokens:
    post:
      operationId: createCardToken
      summary: Save a card for later payments (merchant server)
      description: >-
        Since 1.12.0. The card arrives encrypted to the checkout key (sp2), as from the card form, and is stored
        only in the PCI vault: the answer is a token and the masked card. Saving the same card again returns the
        same token, so a retry is safe. Pay with it by sending card_token in CardDetails.
      security:
        - SecretKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [encrypted_card_data, card_expiry, card_network]
              properties:
                encrypted_card_data: { type: string, minLength: 1, description: 'The PAN in an sp2 envelope.' }
                card_expiry: { type: string, pattern: '^(0[1-9]|1[0-2])/[0-9]{2}$' }
                card_network: { type: string, enum: [VISA, MASTERCARD, RUPAY, AMEX] }
                customer_ref: { type: string, maxLength: 128 }
      responses:
        '201':
          description: Saved (or already saved).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardToken' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/card-tokens/{card_token}:
    delete:
      operationId: deleteCardToken
      summary: Forget a saved card (merchant server)
      description: Since 1.12.0. Takes effect on the next payment, and edge nodes drop it at their next sync.
      security:
        - SecretKey: []
      parameters:
        - { name: card_token, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/terminals:
    get:
      operationId: listTerminals
      summary: List the merchant's terminals (keyset-paginated, ordered by terminal_id)
      security: [{ OAuth2ClientCredentials: [registry:read] }, { OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters:
        - name: merchant_id
          in: query
          description: Required for admins. Merchants may omit it or pass their own.
          schema: { type: string, format: uuid }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TerminalStatus' } }
        - { name: health_state, in: query, schema: { type: string, enum: [HEALTHY, DEGRADED, UNREACHABLE] } }
        - { name: cursor, in: query, description: next_cursor from the previous page., schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: A page of terminals.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Terminal' } }
                  next_cursor: { type: [string, 'null'], format: uuid, description: Null on the last page. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
    post:
      operationId: createTerminal
      summary: Create a terminal record (registration phase 1, by the merchant)
      description: >-
        Creates the terminal as PENDING and returns a single-use registration_token,
        valid for 15 minutes, that the device uses to register. The token is shown only once.
      security:
        - OAuth2ClientCredentials: [registry:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTerminalRequest' }
      responses:
        '201':
          description: Terminal created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateTerminalResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/register:
    post:
      operationId: registerTerminal
      summary: Submit a CSR (registration phase 2, by the terminal)
      description: >-
        Authenticated by the registration_token. Issues a client certificate, moves the
        terminal to PENDING_ACTIVATION, and returns a one-time activation challenge.
        A rejected attempt does not consume the token.
      security: []
      parameters:
        - $ref: '#/components/parameters/TerminalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterTerminalRequest' }
      responses:
        '200':
          description: Certificate issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterTerminalResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/activate:
    post:
      operationId: activateTerminal
      summary: Prove key possession and activate (registration phase 3, by the terminal)
      description: Authenticated by a signature over the activation challenge with the certificate's key.
      security: []
      parameters:
        - $ref: '#/components/parameters/TerminalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateTerminalRequest' }
      responses:
        '200':
          description: Terminal is ACTIVE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivateTerminalResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  # Lifecycle changes. Merchants may act only on their own terminals (others' return 404).
  # Revocation is published to the CA before the status changes; if the CA fails, nothing changes (503).
  /v1/terminals/{terminal_id}/suspend:
    post:
      operationId: suspendTerminal
      summary: ACTIVE → SUSPENDED (merchant or admin). Certificate stays valid; transactions are blocked.
      security: [{ OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      requestBody: { $ref: '#/components/requestBodies/StatusChange' }
      responses: &statusChangeResponses
        '200': { $ref: '#/components/responses/StatusChanged' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/reinstate:
    post:
      operationId: reinstateTerminal
      summary: SUSPENDED → ACTIVE (admin only).
      security: [{ OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      requestBody: { $ref: '#/components/requestBodies/StatusChange' }
      responses: *statusChangeResponses
  /v1/terminals/{terminal_id}/revoke:
    post:
      operationId: revokeTerminal
      summary: ACTIVE, SUSPENDED or PENDING_ACTIVATION → REVOKED (merchant or admin). Revokes the certificate at the CA.
      security: [{ OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      requestBody: { $ref: '#/components/requestBodies/StatusChange' }
      responses: *statusChangeResponses
  /v1/terminals/{terminal_id}/decommission:
    post:
      operationId: decommissionTerminal
      summary: ACTIVE or SUSPENDED → DECOMMISSIONED (merchant only). Revokes the certificate at the CA.
      security: [{ OAuth2ClientCredentials: [registry:write] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      requestBody: { $ref: '#/components/requestBodies/StatusChange' }
      responses: *statusChangeResponses
  /v1/terminals/{terminal_id}/checkout:
    get:
      operationId: getTerminalCheckout
      summary: The next payment intent this terminal should take (long poll)
      description: >-
        Waits up to `wait` seconds for an intent created for this terminal. The terminal then pays it with
        POST /v1/transactions carrying payment_intent_id, the same amount and currency.
      security:
        - MutualTLS: []
      parameters:
        - name: terminal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: wait
          in: query
          required: false
          schema: { type: number, minimum: 0, maximum: 10, default: 0 }
      responses:
        '200':
          description: A payment to take.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutJob' }
        '204':
          description: Nothing to take right now.
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/heartbeat:
    post:
      operationId: terminalHeartbeat
      summary: Signed terminal heartbeat
      description: >-
        Authenticated by X-Signature over the exact request body bytes. Accepted only if sent_at is within
        60 seconds of server time and later than the terminal's previous heartbeat. ACTIVE and SUSPENDED
        terminals are updated (HEALTHY, last_heartbeat_at, firmware_version); a firmware change to an
        uncertified version moves an ACTIVE terminal to SUSPENDED (reason UNCERTIFIED_FIRMWARE). A REVOKED
        terminal's heartbeat is stored but changes nothing. Health then decays to DEGRADED after 90 seconds
        and UNREACHABLE after 5 minutes of silence.
      security: []
      parameters:
        - $ref: '#/components/parameters/TerminalId'
        - name: X-Signature
          in: header
          required: true
          description: >-
            Base64 signature over the raw request body with the terminal certificate's key: ECDSA (DER)
            or RSA PKCS#1 v1.5, SHA-256.
          schema: { type: string, pattern: '^[A-Za-z0-9+/]+={0,2}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sent_at, connectivity_type, latency_ms, firmware_version]
              properties:
                sent_at: { type: string, format: date-time, description: 'Terminal clock, with a UTC offset.' }
                connectivity_type: { type: string, enum: [ETHERNET, CELLULAR, MESH] }
                latency_ms: { type: integer, minimum: 0 }
                firmware_version: { type: string, minLength: 1, maxLength: 64 }
                battery_level: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Heartbeat recorded.
          content:
            application/json:
              schema:
                type: object
                required: [terminal_id, status, health_state]
                properties:
                  terminal_id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/TerminalStatus' }
                  health_state: { type: string, enum: [HEALTHY, DEGRADED, UNREACHABLE] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}:
    get:
      operationId: getTerminal
      summary: Read one terminal
      security: [{ OAuth2ClientCredentials: [registry:read] }, { OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      responses:
        '200':
          description: The terminal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Terminal' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateTerminal
      summary: Replace the terminal's metadata
      description: >-
        Only metadata is mutable. device_model selects the hardware_id pattern and the certified firmware
        list, so it cannot be changed after creation; any other field is a 400.
      security: [{ OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metadata]
              properties:
                metadata: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: The updated terminal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Terminal' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/certificates:
    get:
      operationId: listTerminalCertificates
      summary: Certificate history, newest first
      security: [{ OAuth2ClientCredentials: [registry:read] }, { OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      responses:
        '200':
          description: Every certificate issued to the terminal.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TerminalCertificate' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/heartbeats:
    get:
      operationId: listTerminalHeartbeats
      summary: Recent heartbeats, newest first (for debugging)
      security: [{ OAuth2ClientCredentials: [registry:read] }, { OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters:
        - $ref: '#/components/parameters/TerminalId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200':
          description: The most recent heartbeats.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TerminalHeartbeat' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/events:
    get:
      operationId: listTerminalEvents
      summary: Complete status change history, oldest first
      security: [{ OAuth2ClientCredentials: [registry:read] }, { OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      responses:
        '200':
          description: Every status change, in the order it happened.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TerminalEvent' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/authorization:
    get:
      operationId: authorizeTerminalTransaction
      summary: May this terminal run this payment method for this amount right now? (routing engine)
      description: >-
        Read live from the registry on every call, so a status, firmware or certification change applies to
        the next call. A refusal is a 200 with authorized false and a reason: TERMINAL_NOT_ACTIVE (any status
        but ACTIVE), TERMINAL_UNREACHABLE (no heartbeat in 5 minutes; DEGRADED still authorizes),
        FIRMWARE_UNCERTIFIED, CERTIFICATION_EXPIRED, METHOD_NOT_CERTIFIED (also when the terminal has no
        certification profile) or LIMIT_EXCEEDED (per-transaction limit; the per-day limit is not enforced
        until the transaction engine tracks daily totals). An unknown terminal is 404 TERMINAL_NOT_FOUND.
      security: [{ OAuth2ClientCredentials: [registry:authorize] }]
      parameters:
        - $ref: '#/components/parameters/TerminalId'
        - name: payment_method
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TransactionRequest/properties/payment_method' }
        - name: amount
          in: query
          required: true
          description: Minor units.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerminalAuthorization' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/transactions/sync:
    post:
      operationId: syncOfflineTransactions
      summary: Upload a batch of transactions a terminal accepted while offline
      description: >-
        Terminals queue sales locally when connectivity drops and upload them in one batch when it comes back:
        fifty requests would drain a battery and drop packets on the same bad link. Each item is handled
        independently — one bad item must not fail the other forty-nine — so the response is a per-item result
        and the status stays 200 even when some items were declined. (207 Multi-Status is tempting but many
        HTTP clients treat it as an error and retry the whole batch.)
        The cloud re-checks the offline_limits from the method's capability descriptor, the item age and the
        terminal signature; it is the authority. The SDK enforces the same limits first so a customer is never
        told "yes" for a payment that will fail an hour later.

        **Canonical signature (1.8.0).** A signature cannot cover the object that carries it, so both sides
        sign the item *without* the `signature` field: remove `signature`, sort the remaining keys
        alphabetically, serialise compactly (JSON with no insignificant whitespace, UTF-8), and sign those
        exact bytes with the terminal's registration key. The cloud repeats the same steps and verifies against
        the certificate's public key. Any other serialisation (pretty-printed, keys in insertion order,
        floats reformatted) produces different bytes and fails — which is the point: there is one encoding.

        **Edge nodes (1.9.0).** An on-premise edge node uploads sales it accepted for its merchant's terminals
        with its own certificate. Each item then carries `edge_node_id`, is signed with the edge node's key,
        and is checked against the edge node's own signed offline limits; `terminal_id` names the till that took
        the sale and must belong to the edge node's merchant. Per-item reason `EDGE_MISMATCH`: the item names
        another edge node or merchant.
      security:
        - MutualTLS: []
        - OAuth2ClientCredentials: [transactions:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transactions]
              properties:
                transactions:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [offline_reference, local_timestamp, idempotency_key, amount, currency, payment_method,
                               terminal_id, merchant_id, underlying_rail, method_details, signature]
                    properties:
                      offline_reference:
                        type: string
                        format: uuid
                        description: Generated on the terminal; the per-item key of the batch.
                      local_timestamp:
                        type: string
                        format: date-time
                        description: >-
                          The terminal's clock when the sale was accepted offline. Used for the
                          offline_limits.max_age_minutes check, so a terminal that was offline for a week
                          cannot flush seven-day-old sales.
                      idempotency_key: { $ref: '#/components/schemas/TransactionRequest/properties/idempotency_key' }
                      amount: { $ref: '#/components/schemas/TransactionRequest/properties/amount' }
                      currency: { $ref: '#/components/schemas/TransactionRequest/properties/currency' }
                      payment_method: { $ref: '#/components/schemas/TransactionRequest/properties/payment_method' }
                      terminal_id: { $ref: '#/components/schemas/TransactionRequest/properties/terminal_id' }
                      merchant_id: { $ref: '#/components/schemas/TransactionRequest/properties/merchant_id' }
                      underlying_rail:
                        type: string
                        enum: [CARD, UPI, WALLET, QR]
                        description: >-
                          The rail this queued sale actually belongs to. Named explicitly rather than inferred
                          from method_details: inference is how per-method branching creeps back into the engine,
                          and a misread shape would dispatch a card sale to UPI.
                      method_details: { $ref: '#/components/schemas/TransactionRequest/properties/method_details' }
                      edge_node_id:
                        type: string
                        format: uuid
                        description: >-
                          Since 1.9.0. Set when an edge node queued the sale; must be the edge node whose
                          certificate uploads the batch, and the item is then signed with that edge node's key.
                      signature:
                        type: string
                        description: >-
                          Base64 signature by the terminal's registration key over the canonical item. Without
                          it, anyone who can edit the terminal's local queue can inflate an amount before it
                          syncs.
      responses:
        '200':
          description: Per-item outcomes, in the order submitted.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [offline_reference, status]
                      properties:
                        offline_reference: { type: string, format: uuid }
                        transaction_id: { type: string, description: Present when the item was accepted. }
                        status: { $ref: '#/components/schemas/TransactionStatus' }
                        error: { $ref: '#/components/schemas/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/webhooks/wallet:
    post:
      operationId: walletWebhook
      summary: Wallet provider callback (public; HMAC-authenticated)
      description: >-
        Same contract as `/v1/webhooks/upi`, different headers: `X-Wallet-Timestamp` and `X-Wallet-Signature`,
        over the same `<timestamp>.<raw body>` message and with the same 300-second window. Delivery ids are
        namespaced per provider, so a wallet event cannot collide with a UPI one. A correctly signed callback
        is answered 200 even when it is a duplicate or names a payment we do not know.
      security: []
      parameters:
        - name: X-Wallet-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]+$' }
        - name: X-Wallet-Signature
          in: header
          required: true
          description: Lowercase hex HMAC-SHA256 of "<timestamp>.<raw body>".
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, wallet_transaction_id, status]
              properties:
                event_id: { type: string, maxLength: 128 }
                wallet_transaction_id: { type: string, maxLength: 128 }
                status: { type: string, enum: [SUCCESS, FAILURE] }
                reason: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Acknowledged — applied, a duplicate, or about a payment we do not know.
          content:
            application/json:
              schema:
                type: object
                required: [received, duplicate, applied]
                properties:
                  received: { const: true }
                  duplicate: { type: boolean }
                  applied: { type: boolean }
                  status: { type: [string, 'null'] }
                  reason: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/webhooks/upi:
    post:
      operationId: upiWebhook
      summary: PSP/NPCI callback for a UPI payment (public; HMAC-authenticated)
      description: >-
        Public endpoint a PSP posts the final status of a collect to. Authentication is the HMAC-SHA256
        signature over "<X-UPI-Timestamp>.<raw body>" carried in X-UPI-Signature — not a bearer token and not a
        client certificate, because a payment network is neither a merchant nor a terminal. Requests whose
        timestamp is more than 300 seconds from server time are rejected. Delivery is at-least-once, so
        event_id deduplicates: a repeat is acknowledged with 200 and changes nothing. A correctly signed
        callback is answered 200 even when the payment is unknown, so the provider stops retrying; exceptions
        to that are logged, not retried.
      security: []
      parameters:
        - name: X-UPI-Timestamp
          in: header
          required: true
          description: Unix seconds the provider signed with. Must be within 300s of server time.
          schema: { type: string, pattern: '^[0-9]+$' }
        - name: X-UPI-Signature
          in: header
          required: true
          description: Lowercase hex HMAC-SHA256 of "<timestamp>.<raw body>".
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, psp_transaction_id, status]
              properties:
                event_id:
                  type: string
                  maxLength: 128
                  description: The provider's delivery id. Duplicates are acknowledged and ignored.
                psp_transaction_id: { type: string, maxLength: 128 }
                status: { type: string, enum: [SUCCESS, FAILURE] }
                reason: { type: string, maxLength: 256 }
                rrn: { type: string, maxLength: 32 }
      responses:
        '200':
          description: Acknowledged — applied, a duplicate, or about a payment we do not know.
          content:
            application/json:
              schema:
                type: object
                required: [received, duplicate, applied]
                properties:
                  received: { const: true }
                  duplicate: { type: boolean }
                  applied: { type: boolean }
                  status: { type: [string, 'null'] }
                  reason: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/audit/events:
    get:
      operationId: listAuditEvents
      summary: Read the append-only audit log (Stage 1, Step 7)
      description: >-
        Every recorded event, oldest first, from the hash-chained audit log. One correlation_id returns the whole
        story of one business action across components — a payment's id gives the request, terminal
        authorization, host response and webhook in order — which is the support and dispute workflow. Read-only:
        the log is append-only by database trigger, and each record carries its chain position, prev_hash and
        hash so a client can verify what it received without trusting this API.
      security: [{ OAuth2ClientCredentials: [audit:read] }]
      parameters:
        - name: correlation_id
          in: query
          description: The id tying one action's events together (a transaction id, for payments).
          schema: { type: string, maxLength: 64 }
        - name: entity_id
          in: query
          description: The entity the events are about (a transaction, terminal or merchant id).
          schema: { type: string, maxLength: 64 }
        - name: event_type
          in: query
          schema: { $ref: '#/components/schemas/AuditEvent/properties/event_type' }
        - name: from
          in: query
          description: Events that occurred at or after this instant (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Events that occurred at or before this instant (inclusive).
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          description: Pass next_cursor from the previous page; pages are ordered by sequence.
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: A page of chained events, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/audit/chain:
    get:
      operationId: getAuditChainHead
      summary: Current position of the audit hash chain
      description: >-
        The last sequence number and hash. Ops compare it with ingestion lag; external verifiers use it to
        confirm the log they hold is not behind the platform's.
      security: [{ OAuth2ClientCredentials: [audit:read] }]
      responses:
        '200':
          description: The chain head.
          content:
            application/json:
              schema:
                type: object
                required: [sequence, hash]
                additionalProperties: false
                properties:
                  sequence: { type: integer, minimum: 0 }
                  hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
components:
  requestBodies:
    StatusChange:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason: { type: string, maxLength: 256, description: Recorded in the audit log (and as the revocation reason). }
  parameters:
    TerminalId:
      name: terminal_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentIntentId:
      name: payment_intent_id
      in: path
      required: true
      description: pi_ followed by 32 hex digits; anything else is a 404.
      schema: { type: string }
  securitySchemes:
    # Merchant SDK / merchant backend → cloud API.
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes:
            transactions:write: Initiate and manage transactions
            transactions:read: Read transaction status and history
            registry:read: Read terminal registry entries
            registry:write: Register and update terminals
            registry:admin: Platform-admin terminal operations (any merchant's terminals; reinstate)
            certification:run: Record certification test harness runs (CI, test lab); approves nothing
            registry:authorize: Routing engine's per-transaction terminal authorization check
            audit:read: Read the append-only audit log (support, compliance and dispute tooling)
    # Merchant server → cloud with a secret API key (1.3.0): Authorization: Bearer sk_test_...
    SecretKey:
      type: http
      scheme: bearer
      bearerFormat: sk_test_... / sk_live_...
    # Terminal → cloud (T2C).
    MutualTLS:
      type: mutualTLS
      description: >-
        The terminal presents the X.509 client certificate issued at registration; its terminal_id
        is the URI SAN urn:synapsepay:terminal:{terminal_id}. The gateway rejects, during the TLS
        handshake, any certificate that doesn't chain to the platform CA or is on its CRL. It then
        rejects with 403, before the request reaches the API, a certificate with no terminal URI
        SAN, a path terminal_id that differs from the certificate's, or a terminal that isn't
        ACTIVE. Heartbeats are exempt from the ACTIVE check, so SUSPENDED terminals keep reporting.
  responses:
    StatusChanged:
      description: Status changed.
      content:
        application/json:
          schema:
            type: object
            required: [terminal_id, status, status_changed_at]
            properties:
              terminal_id: { type: string, format: uuid }
              status: { $ref: '#/components/schemas/TerminalStatus' }
              status_changed_at: { type: string, format: date-time }
    Error:
      description: >-
        The request was rejected before a transaction was created (400 invalid body,
        401 not authenticated, 403 missing scope or terminal_id not matching the client
        certificate, 404 unknown terminal on a terminal path, 409 idempotency_key reused
        with a different body or a conflicting state, 422 unknown terminal or merchant
        or an unapproved device model, 5XX server error). Declines are not errors here: they
        return 201 with status FAILED and the error inside the transaction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_request:
              value:
                error_code: INVALID_REQUEST
                error_message: "amount: must be a positive integer"
                error_category: VALIDATION_ERROR
                retryable: false
            idempotency_conflict:
              value:
                error_code: IDEMPOTENCY_KEY_CONFLICT
                error_message: idempotency_key was already used with a different request body
                error_category: VALIDATION_ERROR
                retryable: false
  # Fixtures for adapter developers, contract tests and SDK docs. Each response echoes its request.
  examples:
    CardRequest:
      value:
