  schemas:
    AuditEvent:
      type: object
      additionalProperties: false
      description: >-
        The universal audit event (Stage 1, Step 7). Every component emits this same envelope, and the stored
        form adds the chain position and hashes.
      required: [sequence, event_id, timestamp, event_type, actor, entity_id, correlation_id, payload, prev_hash,
                 hash]
      properties:
        sequence: { type: integer, minimum: 1, description: 'Position in the chain: 1-based, contiguous.' }
        event_id: { type: string, format: uuid }
        timestamp:
          type: string
          format: date-time
          description: When it happened, millisecond precision, UTC.
        event_type:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
          description: >-
            UPPER_SNAKE_CASE. Terminal lifecycle (TERMINAL_*), transaction lifecycle (TRANSACTION_*), ADMIN_ACCESS
            for audited admin reads. New types may appear; key on the category prefix rather than an exhaustive
            list.
          examples: [TRANSACTION_AUTHORIZED, TERMINAL_SUSPENDED]
        actor:
          type: string
          pattern: '^(system|(merchant|terminal|admin|sdk|host-connector):.+)$'
          examples: ['terminal:9f1c...', 'merchant:0b2e...', 'system']
        entity_id: { type: string, description: "The transaction, terminal or merchant the event is about." }
        correlation_id:
          type: string
          description: Ties every event of one business action together; defaults to entity_id.
        payload:
          type: object
          description: >-
            Event-specific detail. Card data is never present: PANs are masked to their last four and secrets
            (CVV, PIN block, encrypted card data) are removed before the record is hashed and stored.
        prev_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hash of the previous record; 64 zeros for sequence 1.
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 'SHA-256(prev_hash + "\n" + canonical JSON of the event).'
    AuditPage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        next_cursor:
          type: [integer, 'null']
          description: Pass as cursor for the next page; null on the last page.

    CreatePaymentIntentRequest:
      type: object
      additionalProperties: false
      required: [idempotency_key, amount, currency]
      properties:
        idempotency_key: { type: string, format: uuid, description: The server SDKs generate one per create. }
        amount: { type: integer, format: int64, minimum: 100, description: 'Smallest currency unit; at least ₹1.00.' }
        currency: { type: string, enum: [INR] }
        capture_mode: { type: string, enum: [AUTO, MANUAL], default: AUTO }
        description: { type: string, maxLength: 512 }
        metadata: { type: object, additionalProperties: { type: string } }
        webhook_url: { type: string, format: uri, pattern: '^https://' }
        terminal_id: { type: string, format: uuid, description: Take the payment on this ACTIVE terminal of the merchant. }
    ConfirmPaymentIntentRequest:
      type: object
      additionalProperties: false
      required: [client_secret, card]
      properties:
        client_secret: { type: string }
        payment_method: { type: string, enum: [CARD], default: CARD }
        card:
          type: object
          additionalProperties: false
          required: [encrypted_card_data, card_expiry, card_network]
          properties:
            encrypted_card_data:
              type: string
              description: The PAN in an sp2 envelope (ECIES to the checkout key; see card-service/src/hsm.rs).
            encrypted_cvv: { type: string, description: 'The security code in an sp2 envelope. Checked, never stored.' }
            card_expiry: { type: string, pattern: '^(0[1-9]|1[0-2])/[0-9]{2}$' }
            card_network: { type: string, enum: [VISA, MASTERCARD, RUPAY, AMEX] }
            cardholder_name: { type: string, description: PII; not stored. }
    CreateCertificationRequest:
      type: object
      additionalProperties: false
      required: [device_model, firmware_version, scheme, acquirer_id, certificate_number, valid_until]
      properties:
        device_model: { type: string, maxLength: 64, examples: ['PAX A920 Pro'] }
        firmware_version:
          type: string
          maxLength: 32
          pattern: '^v?[0-9]+(\.[0-9]+)*$'
          description: Exact version. No wildcards or ranges.
        scheme: { type: string, enum: [VISA, MASTERCARD, RUPAY, AMEX, NPCI_UPI] }
        acquirer_id: { type: string, maxLength: 64, description: The acquirer or PSP host the certification covers. }
        certificate_number: { type: string, maxLength: 128, description: The scheme's own reference. }
        valid_from: { type: string, format: date-time, description: Default now. }
        valid_until: { type: string, format: date-time }
    Certification:
      type: object
      additionalProperties: false
      required: [certification_id, device_model, firmware_version, scheme, acquirer_id, certificate_number, status,
                 valid_from, valid_until]
      properties:
        certification_id: { type: string, format: uuid }
        device_model: { $ref: '#/components/schemas/CreateCertificationRequest/properties/device_model' }
        firmware_version: { $ref: '#/components/schemas/CreateCertificationRequest/properties/firmware_version' }
        scheme: { $ref: '#/components/schemas/CreateCertificationRequest/properties/scheme' }
        acquirer_id: { $ref: '#/components/schemas/CreateCertificationRequest/properties/acquirer_id' }
        certificate_number: { $ref: '#/components/schemas/CreateCertificationRequest/properties/certificate_number' }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
    CardToken:
      type: object
      additionalProperties: false
      required: [token, token_type, card_bin, card_last4, card_network, card_expiry]
      properties:
        token: { type: string, pattern: '^tok_[0-9a-f]{32}$' }
        token_type:
          type: string
          enum: [PAN, DPAN]
          description: DPAN when the card network issued a network token (only usable by this merchant).
        card_bin: { type: string, pattern: '^[0-9]{6}$' }
        card_last4: { type: string, pattern: '^[0-9]{4}$' }
        card_network: { type: string, enum: [VISA, MASTERCARD, RUPAY, AMEX] }
        card_expiry: { type: string }
        customer_ref: { type: string }
    RecoveryStats:
      type: object
      additionalProperties: false
      required: [since, cascaded, recovered, recovered_amount]
      properties:
        since: { type: string, format: date-time }
        cascaded: { type: integer, minimum: 0, description: Payments tried on more than one acquirer. }
        recovered: { type: integer, minimum: 0, description: "Of those, approved by a backup." }
        recovered_amount:
          type: array
          description: Value of the recovered payments, per currency, in minor units.
          items:
            type: object
            additionalProperties: false
            required: [currency, amount]
            properties:
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              amount: { type: integer, minimum: 1 }
    PaymentIntent:
      type: object
      required: [id, status, amount, currency, capture_mode, created_at, updated_at, expires_at]
      properties:
        id: { type: string, description: 'pi_ followed by 32 hex digits.' }
        status:
          type: string
          enum: [REQUIRES_PAYMENT_METHOD, REQUIRES_ACTION, PROCESSING, SUCCEEDED, CANCELED]
          description: >-
            REQUIRES_PAYMENT_METHOD waiting for a card (again, after a decline: see last_payment_error);
            REQUIRES_ACTION waiting for the cardholder's 3-D Secure step (next_action); PROCESSING the bank's answer
            is late (resolved by reconciliation; never charge again); SUCCEEDED paid; CANCELED.
        amount: { type: integer, format: int64 }
        currency: { type: string }
        capture_mode: { type: string, enum: [AUTO, MANUAL] }
        client_secret: { type: string, description: 'pi_..._secret_...; only to the merchant (secret key).' }
        description: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        webhook_url: { type: string }
        terminal_id: { type: string, format: uuid }
        transaction_id: { type: string, description: The latest payment attempt. }
        last_payment_error: { $ref: '#/components/schemas/Error' }
        card:
          type: object
          properties:
            bin: { type: string }
            last4: { type: string }
        next_action:
          type: object
          required: [type, url]
          properties:
            type: { const: THREE_DS_CHALLENGE }
            url: { type: string, description: Relative to the API; the issuer's challenge page. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    CheckoutJob:
      type: object
      required: [payment_intent_id, amount, currency, capture_mode, expires_at]
      properties:
        payment_intent_id: { type: string }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        capture_mode: { type: string, enum: [AUTO, MANUAL] }
        description: { type: string }
        expires_at: { type: string, format: date-time }
    TransactionRequest:
      type: object
      additionalProperties: false
      required:
        - idempotency_key
        - amount
        - currency
        - payment_method
        - method_details
        - terminal_id
        - merchant_id
      properties:
        idempotency_key:
          type: string
          format: uuid
          description: >-
            Client-generated. If the same key is sent twice, the server returns
            the original response without reprocessing. Critical for payment retries.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Smallest currency unit (paise for INR). 50000 = ₹500.00. Never use floats.
          examples: [50000]
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code.
          examples: [INR]
        payment_method:
          type: string
          enum: [CARD, UPI, WALLET, QR, OFFLINE]
        method_details:
          type: object
          description: Discriminated by payment_method; the variant is chosen by the rules in allOf below.
        terminal_id:
          type: string
          minLength: 1
          description: Must exist in the Terminal Registry (checked server-side).
        merchant_id:
          type: string
          minLength: 1
          description: The merchant on whose behalf the payment is processed.
        customer_ref:
          type: string
          description: Optional merchant-side customer identifier.
        capture_mode:
          type: string
          enum: [AUTO, MANUAL]
          default: AUTO
        description:
          type: string
          description: Human-readable description.
        metadata:
          type: object
          description: Free-form key-value pairs for the merchant.
          additionalProperties:
            type: string
        webhook_url:
          type: string
          format: uri
          pattern: '^https://'
          description: Where to send the final status notification. HTTPS only.
        payment_intent_id:
          type: string
          pattern: '^pi_[0-9a-f]{32}$'
          description: >-
            Since 1.3.0. Terminals only: this payment completes a payment intent from terminal checkout; amount
            and currency must match it.
      # The discriminator (payment_method) sits beside method_details, not inside it,
      # so OpenAPI's `discriminator` keyword can't be used; JSON Schema if/then does the job.
      allOf:
        - if: { properties: { payment_method: { const: CARD } } }
          then: { properties: { method_details: { $ref: '#/components/schemas/CardDetails' } } }
        - if: { properties: { payment_method: { const: UPI } } }
          then: { properties: { method_details: { $ref: '#/components/schemas/UpiDetails' } } }
        - if: { properties: { payment_method: { const: WALLET } } }
          then: { properties: { method_details: { $ref: '#/components/schemas/WalletDetails' } } }
        - if: { properties: { payment_method: { const: QR } } }
          then: { properties: { method_details: { $ref: '#/components/schemas/QrDetails' } } }
        - if: { properties: { payment_method: { const: OFFLINE } } }
          then: { properties: { method_details: { $ref: '#/components/schemas/OfflineDetails' } } }

    TransactionResponse:
      type: object
      required:
        - transaction_id
        - idempotency_key
        - status
        - amount
        - currency
        - payment_method
        - created_at
        - updated_at
      properties:
        transaction_id:
          type: string
          description: Server-generated unique ID.
        # Echoed fields reuse the request definitions so the two can't drift apart.
        idempotency_key: { $ref: '#/components/schemas/TransactionRequest/properties/idempotency_key' }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        amount: { $ref: '#/components/schemas/TransactionRequest/properties/amount' }
        currency: { $ref: '#/components/schemas/TransactionRequest/properties/currency' }
        payment_method: { $ref: '#/components/schemas/TransactionRequest/properties/payment_method' }
        method_reference:
          type: string
          description: The host's transaction ID, UPI txn ID, or wallet reference. Absent until the host responds.
        auth_code:
          type: string
          description: Authorization code from the issuer, if applicable.
        next_action:
          type: object
          description: >-
            The SDK must open `url` for the customer to finish the payment (wallet login, 3-D Secure). Present
            only when the rail cannot complete in this call; otherwise the response is final or PENDING. Same
            shape the payment intent uses, so the SDK has one branch to write, not two.
          required: [type, url]
          properties:
            type:
              type: string
              enum: [WALLET_REDIRECT, THREE_DS_REDIRECT]
            url: { type: string, format: uri }
        created_at:
          type: string
          format: date-time
          description: When the transaction was initiated.
        updated_at:
          type: string
          format: date-time
          description: When the status last changed.
        error:
          $ref: '#/components/schemas/Error'
          description: Only present if status is FAILED.
        payment_intent_id:
          type: string
          description: Since 1.3.0. The payment intent this transaction pays, if any.
        metadata: { $ref: '#/components/schemas/TransactionRequest/properties/metadata' }
      if: { properties: { status: { const: FAILED } } }
      then: { required: [error] }
      else: { not: { required: [error] } }

    TerminalStatus:
      type: string
      enum: [PENDING, PENDING_ACTIVATION, ACTIVE, SUSPENDED, REVOKED, DECOMMISSIONED, REJECTED]

    TransactionStatus:
      type: string
      enum:
        - INITIATED
        - PENDING
        - PENDING_OFFLINE
        - AUTHORIZED
        - CAPTURED
        - SETTLED
        - VOIDED
        - FAILED
        - REFUNDED
        - PARTIALLY_REFUNDED
      description: |
        Transaction lifecycle. Allowed transitions:

        PENDING_OFFLINE is a terminal-side state (the SDK's local queue, and the edge node in Stage 4). The
        cloud never writes it: it only learns of an offline payment at sync, by which point the underlying rail
        has already decided PENDING, SETTLED or FAILED. The value exists in the enum so the terminal can tell
        the customer (and support) "queued, not yet synced" without inventing its own vocabulary.
        - INITIATED → PENDING
        - PENDING → AUTHORIZED | FAILED
        - AUTHORIZED → CAPTURED | VOIDED (void only before capture)
        - CAPTURED → SETTLED | REFUNDED (full) | PARTIALLY_REFUNDED
        - SETTLED → REFUNDED (full) | PARTIALLY_REFUNDED
        - PARTIALLY_REFUNDED → PARTIALLY_REFUNDED (another partial refund) | REFUNDED (remainder)

        Methods may skip states:

        - CARD: all states.
        - UPI: INITIATED → PENDING → SETTLED (no separate capture).
        - OFFLINE: INITIATED → PENDING (queued) → AUTHORIZED → SETTLED on sync.

        The capability descriptor (Task 1.6) lists the transitions each method supports.

    Error:
      type: object
      additionalProperties: false
      required: [error_code, error_message, error_category, retryable]
      properties:
        error_code:
          type: string
          enum:
            - INSUFFICIENT_FUNDS
            - ISSUER_DECLINED
            - INVALID_VPA
            - HOST_TIMEOUT
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - FORBIDDEN
            - IDEMPOTENCY_KEY_CONFLICT
            - TERMINAL_NOT_FOUND
            - MERCHANT_NOT_FOUND
            - INTERNAL_ERROR
            - AUTHENTICATION_FAILED
            - PAYMENT_INTENT_NOT_FOUND
            - CARD_TOKEN_NOT_FOUND
          description: >-
            Machine-readable code. ISSUER_DECLINED (since 1.1.0) covers issuer declines without a more
            specific code; error_category says whether it's soft or hard. Values are added over time, so
            clients must handle an unknown code by its error_category.
        error_message:
          type: string
          description: Human-readable description. Must never contain card data, tokens or other PII.
        error_category:
          type: string
          enum: [SOFT_DECLINE, HARD_DECLINE, SYSTEM_ERROR, VALIDATION_ERROR, AUTHENTICATION_ERROR]
          description: >-
            Drives the Cascade Engine: SOFT_DECLINE cascades to another acquirer,
            HARD_DECLINE stops immediately.
        retryable:
          type: boolean
          description: >-
            Whether the client should retry with the same idempotency_key. When true, the
            server must not store this response as the key's final result, or the retry
            would just replay the failure.

    CapabilityDescriptor:
      type: object
      description: >-
        What a payment method supports. Downstream services (e.g. Dispute Management)
        branch on these values instead of hardcoding per-method logic.
      additionalProperties: false
      required:
        - payment_method
        - supports_chargeback
        - supports_recurring
        - supports_offline
        - supports_refund
        - supports_partial_refund
        - supports_partial_capture
        - settlement_timeline
        - auth_type
        - dispute_rules
        - transitions
        - is_synchronous
      properties:
        payment_method: { $ref: '#/components/schemas/TransactionRequest/properties/payment_method' }
        supports_chargeback: { type: boolean }
        supports_recurring: { type: boolean }
        supports_offline: { type: boolean }
        supports_refund: { type: boolean }
        supports_partial_refund: { type: boolean }
        supports_partial_capture: { type: boolean }
        settlement_timeline:
          type: string
          examples: [instant]
        auth_type:
          type: string
          examples: [vpa_collect]
        is_synchronous:
          type: boolean
          description: >-
            True when a successful initiate() returns the network's final outcome in the same response, so the
            SDK can show a result immediately (card present: the issuer authorizes in-line). False when the
            rail answers PENDING and settles through a webhook (UPI collect, wallet OTP, QR, offline sync), so
            the SDK must wait for the webhook or poll. The engine uses it to know that a PENDING result is the
            method working as designed, not a timeout.
        offline_limits:
          type: object
          description: >-
            Present only for methods accepted without connectivity. The SDK enforces these locally, because the
            cloud cannot refuse a transaction it has not received yet; the cloud re-checks them on sync and is
            the authority that can fail the payment.
          required: [max_per_txn, currency, max_age_minutes]
          properties:
            max_per_txn: { type: integer, minimum: 1, description: "Minor units, per transaction." }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            max_age_minutes:
              type: integer
              minimum: 1
              description: A queued payment older than this is refused on sync.
        dispute_rules:
          type: object
          additionalProperties: false
          required: [framework, dispute_window_days]
          properties:
            framework:
              type: string
              enum: [CARD_SCHEME, NPCI_UPI, NONE]
              description: >-
                Which dispute framework governs this method. CARD_SCHEME: Visa/Mastercard/RuPay
                chargeback rules. NPCI_UPI: NPCI's UPI dispute and grievance framework.
                NONE: no formal dispute mechanism (e.g. OFFLINE in v1).
            dispute_window_days:
              type: integer
              minimum: 0
              description: Days from settlement within which a dispute can be raised.
            resolution_timeline_days:
              type: integer
              minimum: 0
              description: Maximum days for resolution under the framework.
        transitions:
          type: array
          description: The state transitions (Task 1.4) this method can make.
          items:
            type: object
            additionalProperties: false
            required: [from, to]
            properties:
              from: { $ref: '#/components/schemas/TransactionStatus' }
              to: { $ref: '#/components/schemas/TransactionStatus' }

    CreateTerminalRequest:
      type: object
      additionalProperties: false
      required: [merchant_id, device_serial, device_model]
      properties:
        merchant_id:
          type: string
          format: uuid
          description: Must be the authenticated merchant.
        device_serial: { type: string, minLength: 1, maxLength: 64, description: Hardware serial; unique. }
        device_model: { type: string, minLength: 1, maxLength: 64, description: Must be an approved model. }
        metadata:
          type: object
          additionalProperties: { type: string }
          description: Free-form, e.g. a location label.

    CreateTerminalResponse:
      type: object
      required: [terminal_id, status, registration_token, registration_token_expires_at]
      properties:
        terminal_id: { type: string, format: uuid }
        status: { type: string, const: PENDING }
        registration_token: { type: string, description: Single-use. Shown only in this response. }
        registration_token_expires_at: { type: string, format: date-time }

    RegisterTerminalRequest:
      type: object
      additionalProperties: false
      required: [registration_token, csr_pem, secure_element_id, firmware_version, hardware_id, device_fingerprint]
      properties:
        registration_token: { type: string, minLength: 1, maxLength: 128 }
        csr_pem:
          type: string
          minLength: 1
          maxLength: 8192
          description: PKCS#10 CSR, EC P-256 or RSA >= 2048. Its subject is ignored; the certificate's CN is the terminal_id.
        secure_element_id: { $ref: '#/components/schemas/FingerprintPart' }
        firmware_version: { $ref: '#/components/schemas/FingerprintPart' }
        hardware_id:
          $ref: '#/components/schemas/FingerprintPart'
          description: Must match the registered model's hardware_id format.
        device_fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hex SHA-256 of "secure_element_id|firmware_version|hardware_id".

    FingerprintPart:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[^|]+$'

    RegisterTerminalResponse:
      type: object
      required: [terminal_id, status, certificate_pem, certificate_serial, certificate_expires_at,
                 ca_certificate_pem, activation_challenge, activation_challenge_expires_at]
      properties:
        terminal_id: { type: string, format: uuid }
        status: { type: string, const: PENDING_ACTIVATION }
        certificate_pem: { type: string }
        certificate_serial: { type: string, description: Hex X.509 serial. }
        certificate_expires_at: { type: string, format: date-time }
        ca_certificate_pem: { type: string, description: The issuing intermediate CA. }
        activation_challenge:
          type: string
          contentEncoding: base64
          description: Sign the decoded bytes with SHA-256 using the certificate's key.
        activation_challenge_expires_at: { type: string, format: date-time }

    ActivateTerminalRequest:
      type: object
      additionalProperties: false
      required: [signed_challenge]
      properties:
        signed_challenge:
          type: string
          contentEncoding: base64
          minLength: 1
          maxLength: 1024
          description: ECDSA (DER) or RSA PKCS#1 v1.5 signature, SHA-256, over the decoded challenge.

    ActivateTerminalResponse:
      type: object
      required: [terminal_id, status, activated_at]
      properties:
        terminal_id: { type: string, format: uuid }
        status: { type: string, const: ACTIVE }
        activated_at: { type: string, format: date-time }

    Terminal:
      type: object
      required: [terminal_id, merchant_id, device_serial, device_model, firmware_version, status, health_state,
                 last_heartbeat_at, certification_profile_id, registered_at, activated_at, status_changed_at, metadata]
      properties:
        terminal_id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        device_serial: { type: string }
        device_model: { type: string }
        firmware_version: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TerminalStatus' }
        health_state: { type: string, enum: [HEALTHY, DEGRADED, UNREACHABLE], description: Refreshed every 30 seconds. }
        last_heartbeat_at: { type: [string, 'null'], format: date-time }
        certification_profile_id: { type: [string, 'null'], format: uuid }
        registered_at: { type: string, format: date-time }
        activated_at: { type: [string, 'null'], format: date-time }
        status_changed_at: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: { type: string } }

    TerminalCertificate:
      type: object
      required: [serial_number, issued_at, expires_at, revoked_at, revocation_reason, current]
      properties:
        serial_number: { type: string }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        revocation_reason: { type: [string, 'null'] }
        current: { type: boolean, description: The certificate the terminal currently authenticates with. }

    TerminalHeartbeat:
      type: object
      required: [sent_at, received_at, connectivity_type, latency_ms, firmware_version, battery_level]
      properties:
        sent_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        connectivity_type: { type: string, enum: [ETHERNET, CELLULAR, MESH] }
        latency_ms: { type: integer }
        firmware_version: { type: string }
        battery_level: { type: [integer, 'null'] }

    TerminalEvent:
      type: object
      required: [occurred_at, action, from_status, to_status, actor_type, reason]
      properties:
        occurred_at: { type: string, format: date-time }
        action: { type: string, examples: [create, register, activate, suspend, reinstate, revoke, decommission, reject] }
        from_status: { oneOf: [{ $ref: '#/components/schemas/TerminalStatus' }, { type: 'null' }] }
        to_status: { $ref: '#/components/schemas/TerminalStatus' }
        actor_type: { type: string, enum: [TERMINAL, MERCHANT, ADMIN, SYSTEM] }
        reason: { type: [string, 'null'] }

    TerminalAuthorization:
      type: object
      required: [terminal_id, authorized, status, reason]
      properties:
        terminal_id: { type: string, format: uuid }
        authorized: { type: boolean }
        status: { $ref: '#/components/schemas/TerminalStatus' }
        reason:
          type: [string, 'null']
          enum: [TERMINAL_NOT_ACTIVE, TERMINAL_UNREACHABLE, FIRMWARE_UNCERTIFIED, CERTIFICATION_EXPIRED,
                 METHOD_NOT_CERTIFIED, LIMIT_EXCEEDED, null]
        health_state: { type: string, enum: [HEALTHY, DEGRADED], description: Only when authorized. }
        certification:
          type: object
          description: Only when authorized.
          required: [profile_id, certified_for, expires_at]
          properties:
            profile_id: { type: string, format: uuid }
            certified_for:
              type: array
              items: { $ref: '#/components/schemas/TransactionRequest/properties/payment_method' }
            expires_at: { type: string, format: date-time }
        limits:
          type: object
          description: Only when authorized. Minor units.
          required: [per_transaction, per_day]
          properties:
            per_transaction: { type: integer }
            per_day: { type: integer }
        status_changed_at: { type: string, format: date-time, description: Only when not authorized. }

    CardDetails:
      type: object
      additionalProperties: false
      required: [card_network]
      description: >-
        Exactly one card: encrypted_card_data (with card_expiry), or since 1.12.0 a saved card's card_token
        (card_expiry optional; the saved one is used).
      oneOf:
        - required: [encrypted_card_data, card_expiry]
          not: { required: [card_token] }
        - required: [card_token]
          not: { required: [encrypted_card_data] }
      properties:
        card_token:
          type: string
          pattern: '^tok_[0-9a-f]{32}$'
          description: >-
            Since 1.12.0. A card this merchant saved with createCardToken. Only the merchant that saved it can pay
            with it.
        encrypted_card_data:
          type: string
          minLength: 1
          description: >-
            The PAN, encrypted by the terminal's secure element under a per-transaction key (DUKPT) that only
            the platform's HSM can derive. Never a raw PAN. Envelope: sp1.<KSN base64url>.<nonce||ciphertext
            base64url> (1.2.0; see card-service/src/hsm.rs).
        card_expiry:
          type: string
          pattern: '^(0[1-9]|1[0-2])/[0-9]{2}$'
          description: MM/YY.
          examples: [08/28]
        cardholder_name:
          type: string
          description: PII; must never be logged.
        card_network:
          type: string
          enum: [VISA, MASTERCARD, RUPAY, AMEX]
        pin_block:
          type: string
          minLength: 1
          description: >-
            Since 1.2.0. The cardholder's PIN as an ISO 9564 format 0 block, encrypted by the PIN pad in the same
            envelope as encrypted_card_data. Required by the issuer for chip payments and for contactless above
            the no-PIN limit (₹5,000 in India). Never logged.
        emv_data:
          type: string
          pattern: '^([0-9A-F]{2}){1,255}$'
          description: >-
            Since 1.11.0. Chip and contactless payments: the card's EMV data as uppercase hex BER-TLV, sent to the
            acquirer as DE 55. It carries the application cryptogram the issuer verifies (9F26) and its inputs
            (9F02 amount, 5F2A currency, 9F37 unpredictable number, 9F36 ATC, 95 TVR, 9A date, 9C type, 82 AIP,
            9F10 issuer application data, 9F27 cryptogram information). Card data: may repeat the PAN (5A);
            never logged.

    UpiDetails:
      type: object
      additionalProperties: false
      description: Payee identified by VPA (typed, picked from contacts or deep-linked). A scanned QR is payment_method QR.
      required: [vpa, flow_type]
      properties:
        vpa:
          type: string
          pattern: '^[A-Za-z0-9._-]+@[A-Za-z0-9]+$'
          examples: [user@okaxis]
        flow_type:
          type: string
          enum: [COLLECT, INTENT, MANDATE]
        mandate_details:
          type: object
          description: Only allowed, and required, when flow_type is MANDATE. Fields not yet specified.
      if: { properties: { flow_type: { const: MANDATE } } }
      then: { required: [mandate_details] }
      else: { not: { required: [mandate_details] } }

    WalletDetails:
      type: object
      additionalProperties: false
      required: [wallet_provider]
      properties:
        wallet_provider:
          type: string
          enum: [PAYTM, PHONEPE, AMAZON_PAY]
        wallet_token:
          type: string
          minLength: 1
          description: >-
            Optional since 1.7.0. Present: a direct debit against a saved wallet (returning customer, settled
            in one call). Omitted: a redirect flow — the response carries next_action.url for the customer to
            log in and authorise at the provider (first-time customer).

    QrDetails:
      type: object
      additionalProperties: false
      description: >-
        Payee identified by a scanned QR. The transaction is recorded as QR, but the QR
        adapter dispatches to the adapter of qr_encoded_rail (e.g. a UPI rail runs the
        UPI adapter's core logic), and that rail's capability descriptor and dispute
        rules apply. The QR descriptor applies only when the rail is UNKNOWN.
      required: [qr_data, qr_standard, qr_encoded_rail]
      properties:
        qr_data:
          type: string
          minLength: 1
          description: Raw QR payload as scanned.
        qr_standard:
          type: string
          enum: [UPI_QR, BHARAT_QR_STATIC, BHARAT_QR_DYNAMIC, PROPRIETARY_QR]
          description: The QR specification the payload conforms to.
        qr_encoded_rail:
          type: string
          enum: [UPI, CARD_SCHEME, WALLET, UNKNOWN]
          description: >-
            The payment rail the QR resolves to; downstream routing and capability logic
            read this. Client-supplied, so the server must check it against qr_data.

    OfflineDetails:
      type: object
      additionalProperties: false
      required: [offline_reference, offline_limits, local_fraud_score]
      properties:
        offline_reference:
          type: string
          minLength: 1
          description: Locally generated reference.
        offline_limits:
          type: object
          additionalProperties: false
          required: [per_transaction, per_day]
          description: >-
            Limits enforced at the edge, in the smallest currency unit. Informational only:
            the server must re-check against limits it holds, never trust these values.
          properties:
            per_transaction: { type: integer, format: int64, minimum: 0 }
            per_day: { type: integer, format: int64, minimum: 0 }
        local_fraud_score:
          type: number
          description: >-
            Score computed by the edge fraud engine. Client-supplied, so it is a signal only;
            the server must not use it to skip its own risk checks.
