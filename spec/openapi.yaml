openapi: 3.1.0
info:
  title: Synapse Pay API
  version: 1.2.0
  description: >-
    v1 was frozen at 1.0.0: later 1.x versions only add to it. Any breaking change
    goes through a versioned process (e.g. a /v2 endpoint). 1.1.0 adds terminal registration, transaction-time authorization and the registry query API. 1.2.0 adds the optional CardDetails.pin_block and documents the card data envelope.
servers:
  - url: /api
# Merchant backends use OAuth2; terminals use mTLS. Either satisfies a request.
security:
  - OAuth2ClientCredentials: [transactions:write]
  - MutualTLS: []
webhooks:
  transactionStatus:
    post:
      operationId: transactionStatusWebhook
      summary: Final transaction status, sent to the request's webhook_url
      description: >-
        Signed with HMAC-SHA256 instead of OAuth/mTLS. The per-merchant secret is
        provisioned at merchant onboarding; the merchant record's webhook_secret_id
        (Terminal Registry) selects which secret signs. Receivers must verify the
        signature over the raw body bytes, before parsing, using a constant-time compare.
      security: []
      parameters:
        - name: X-Signature
          in: header
          required: true
          description: Lowercase hex HMAC-SHA256 of the raw request body, keyed with the merchant's webhook secret.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionResponse'
      responses:
        2XX:
          description: Receipt acknowledged.
paths:
  /v1/transactions:
    post:
      operationId: createTransaction
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            examples:
              card: { $ref: '#/components/examples/CardRequest' }
              upi: { $ref: '#/components/examples/UpiRequest' }
              wallet: { $ref: '#/components/examples/WalletRequest' }
              qr: { $ref: '#/components/examples/QrRequest' }
              offline: { $ref: '#/components/examples/OfflineRequest' }
      responses:
        '201':
          description: >-
            Transaction created. A retry with the same idempotency_key returns this
            same body without reprocessing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                card_success: { $ref: '#/components/examples/CardSuccess' }
                card_failure: { $ref: '#/components/examples/CardFailure' }
                upi_success: { $ref: '#/components/examples/UpiSuccess' }
                upi_failure: { $ref: '#/components/examples/UpiFailure' }
                wallet_success: { $ref: '#/components/examples/WalletSuccess' }
                wallet_failure: { $ref: '#/components/examples/WalletFailure' }
                qr_success: { $ref: '#/components/examples/QrSuccess' }
                qr_failure: { $ref: '#/components/examples/QrFailure' }
                offline_success: { $ref: '#/components/examples/OfflineSuccess' }
                offline_failure: { $ref: '#/components/examples/OfflineFailure' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/capabilities/{payment_method}:
    get:
      operationId: getCapabilities
      summary: Get the static capability descriptor for a payment method
      description: >-
        Static; the merchant SDK fetches each descriptor once at startup and caches it.
        For a QR transaction, use the descriptor of its qr_encoded_rail (UPI, CARD or
        WALLET); the QR descriptor applies only when the rail is UNKNOWN.
      security:
        - OAuth2ClientCredentials: [transactions:read]
        - MutualTLS: []
      parameters:
        - name: payment_method
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TransactionRequest/properties/payment_method' }
      responses:
        '200':
          description: The descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDescriptor'
              examples:
                card: { $ref: '#/components/examples/CardCapabilities' }
                upi: { $ref: '#/components/examples/UpiCapabilities' }
                wallet: { $ref: '#/components/examples/WalletCapabilities' }
                qr: { $ref: '#/components/examples/QrCapabilities' }
                offline: { $ref: '#/components/examples/OfflineCapabilities' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  # Query and management. Merchants see only their own terminals (others' return 404); registry:admin may
  # act on any merchant's, and every such admin access is recorded in the audit log.
  /v1/terminals:
    get:
      operationId: listTerminals
      summary: List the merchant's terminals (keyset-paginated, ordered by terminal_id)
      security: [{ OAuth2ClientCredentials: [registry:read] }, { OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters:
        - name: merchant_id
          in: query
          description: Required for admins. Merchants may omit it or pass their own.
          schema: { type: string, format: uuid }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TerminalStatus' } }
        - { name: health_state, in: query, schema: { type: string, enum: [HEALTHY, DEGRADED, UNREACHABLE] } }
        - { name: cursor, in: query, description: next_cursor from the previous page., schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: A page of terminals.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Terminal' } }
                  next_cursor: { type: [string, 'null'], format: uuid, description: Null on the last page. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
    post:
      operationId: createTerminal
      summary: Create a terminal record (registration phase 1, by the merchant)
      description: >-
        Creates the terminal as PENDING and returns a single-use registration_token,
        valid for 15 minutes, that the device uses to register. The token is shown only once.
      security:
        - OAuth2ClientCredentials: [registry:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTerminalRequest' }
      responses:
        '201':
          description: Terminal created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateTerminalResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/register:
    post:
      operationId: registerTerminal
      summary: Submit a CSR (registration phase 2, by the terminal)
      description: >-
        Authenticated by the registration_token. Issues a client certificate, moves the
        terminal to PENDING_ACTIVATION, and returns a one-time activation challenge.
        A rejected attempt does not consume the token.
      security: []
      parameters:
        - $ref: '#/components/parameters/TerminalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterTerminalRequest' }
      responses:
        '200':
          description: Certificate issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterTerminalResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/activate:
    post:
      operationId: activateTerminal
      summary: Prove key possession and activate (registration phase 3, by the terminal)
      description: Authenticated by a signature over the activation challenge with the certificate's key.
      security: []
      parameters:
        - $ref: '#/components/parameters/TerminalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateTerminalRequest' }
      responses:
        '200':
          description: Terminal is ACTIVE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivateTerminalResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  # Lifecycle changes. Merchants may act only on their own terminals (others' return 404).
  # Revocation is published to the CA before the status changes; if the CA fails, nothing changes (503).
  /v1/terminals/{terminal_id}/suspend:
    post:
      operationId: suspendTerminal
      summary: ACTIVE → SUSPENDED (merchant or admin). Certificate stays valid; transactions are blocked.
      security: [{ OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      requestBody: { $ref: '#/components/requestBodies/StatusChange' }
      responses: &statusChangeResponses
        '200': { $ref: '#/components/responses/StatusChanged' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/reinstate:
    post:
      operationId: reinstateTerminal
      summary: SUSPENDED → ACTIVE (admin only).
      security: [{ OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      requestBody: { $ref: '#/components/requestBodies/StatusChange' }
      responses: *statusChangeResponses
  /v1/terminals/{terminal_id}/revoke:
    post:
      operationId: revokeTerminal
      summary: ACTIVE, SUSPENDED or PENDING_ACTIVATION → REVOKED (merchant or admin). Revokes the certificate at the CA.
      security: [{ OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      requestBody: { $ref: '#/components/requestBodies/StatusChange' }
      responses: *statusChangeResponses
  /v1/terminals/{terminal_id}/decommission:
    post:
      operationId: decommissionTerminal
      summary: ACTIVE or SUSPENDED → DECOMMISSIONED (merchant only). Revokes the certificate at the CA.
      security: [{ OAuth2ClientCredentials: [registry:write] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      requestBody: { $ref: '#/components/requestBodies/StatusChange' }
      responses: *statusChangeResponses
  /v1/terminals/{terminal_id}/heartbeat:
    post:
      operationId: terminalHeartbeat
      summary: Signed terminal heartbeat
      description: >-
        Authenticated by X-Signature over the exact request body bytes. Accepted only if sent_at is within
        60 seconds of server time and later than the terminal's previous heartbeat. ACTIVE and SUSPENDED
        terminals are updated (HEALTHY, last_heartbeat_at, firmware_version); a firmware change to an
        uncertified version moves an ACTIVE terminal to SUSPENDED (reason UNCERTIFIED_FIRMWARE). A REVOKED
        terminal's heartbeat is stored but changes nothing. Health then decays to DEGRADED after 90 seconds
        and UNREACHABLE after 5 minutes of silence.
      security: []
      parameters:
        - $ref: '#/components/parameters/TerminalId'
        - name: X-Signature
          in: header
          required: true
          description: >-
            Base64 signature over the raw request body with the terminal certificate's key: ECDSA (DER)
            or RSA PKCS#1 v1.5, SHA-256.
          schema: { type: string, pattern: '^[A-Za-z0-9+/]+={0,2}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sent_at, connectivity_type, latency_ms, firmware_version]
              properties:
                sent_at: { type: string, format: date-time, description: 'Terminal clock, with a UTC offset.' }
                connectivity_type: { type: string, enum: [ETHERNET, CELLULAR, MESH] }
                latency_ms: { type: integer, minimum: 0 }
                firmware_version: { type: string, minLength: 1, maxLength: 64 }
                battery_level: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Heartbeat recorded.
          content:
            application/json:
              schema:
                type: object
                required: [terminal_id, status, health_state]
                properties:
                  terminal_id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/TerminalStatus' }
                  health_state: { type: string, enum: [HEALTHY, DEGRADED, UNREACHABLE] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}:
    get:
      operationId: getTerminal
      summary: Read one terminal
      security: [{ OAuth2ClientCredentials: [registry:read] }, { OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      responses:
        '200':
          description: The terminal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Terminal' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateTerminal
      summary: Replace the terminal's metadata
      description: >-
        Only metadata is mutable. device_model selects the hardware_id pattern and the certified firmware
        list, so it cannot be changed after creation; any other field is a 400.
      security: [{ OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metadata]
              properties:
                metadata: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: The updated terminal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Terminal' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/certificates:
    get:
      operationId: listTerminalCertificates
      summary: Certificate history, newest first
      security: [{ OAuth2ClientCredentials: [registry:read] }, { OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      responses:
        '200':
          description: Every certificate issued to the terminal.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TerminalCertificate' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/heartbeats:
    get:
      operationId: listTerminalHeartbeats
      summary: Recent heartbeats, newest first (for debugging)
      security: [{ OAuth2ClientCredentials: [registry:read] }, { OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters:
        - $ref: '#/components/parameters/TerminalId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200':
          description: The most recent heartbeats.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TerminalHeartbeat' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/events:
    get:
      operationId: listTerminalEvents
      summary: Complete status change history, oldest first
      security: [{ OAuth2ClientCredentials: [registry:read] }, { OAuth2ClientCredentials: [registry:write] }, { OAuth2ClientCredentials: [registry:admin] }]
      parameters: [{ $ref: '#/components/parameters/TerminalId' }]
      responses:
        '200':
          description: Every status change, in the order it happened.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TerminalEvent' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
  /v1/terminals/{terminal_id}/authorization:
    get:
      operationId: authorizeTerminalTransaction
      summary: May this terminal run this payment method for this amount right now? (routing engine)
      description: >-
        Read live from the registry on every call, so a status, firmware or certification change applies to
        the next call. A refusal is a 200 with authorized false and a reason: TERMINAL_NOT_ACTIVE (any status
        but ACTIVE), TERMINAL_UNREACHABLE (no heartbeat in 5 minutes; DEGRADED still authorizes),
        FIRMWARE_UNCERTIFIED, CERTIFICATION_EXPIRED, METHOD_NOT_CERTIFIED (also when the terminal has no
        certification profile) or LIMIT_EXCEEDED (per-transaction limit; the per-day limit is not enforced
        until the transaction engine tracks daily totals). An unknown terminal is 404 TERMINAL_NOT_FOUND.
      security: [{ OAuth2ClientCredentials: [registry:authorize] }]
      parameters:
        - $ref: '#/components/parameters/TerminalId'
        - name: payment_method
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TransactionRequest/properties/payment_method' }
        - name: amount
          in: query
          required: true
          description: Minor units.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerminalAuthorization' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        5XX: { $ref: '#/components/responses/Error' }
components:
  requestBodies:
    StatusChange:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason: { type: string, maxLength: 256, description: Recorded in the audit log (and as the revocation reason). }
  parameters:
    TerminalId:
      name: terminal_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    # Merchant SDK / merchant backend → cloud API.
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes:
            transactions:write: Initiate and manage transactions
            transactions:read: Read transaction status and history
            registry:read: Read terminal registry entries
            registry:write: Register and update terminals
            registry:admin: Platform-admin terminal operations (any merchant's terminals; reinstate)
            registry:authorize: Routing engine's per-transaction terminal authorization check
    # Terminal → cloud (T2C).
    MutualTLS:
      type: mutualTLS
      description: >-
        The terminal presents the X.509 client certificate issued at registration; its terminal_id
        is the URI SAN urn:synapsepay:terminal:{terminal_id}. The gateway rejects, during the TLS
        handshake, any certificate that doesn't chain to the platform CA or is on its CRL. It then
        rejects with 403, before the request reaches the API, a certificate with no terminal URI
        SAN, a path terminal_id that differs from the certificate's, or a terminal that isn't
        ACTIVE. Heartbeats are exempt from the ACTIVE check, so SUSPENDED terminals keep reporting.
  responses:
    StatusChanged:
      description: Status changed.
      content:
        application/json:
          schema:
            type: object
            required: [terminal_id, status, status_changed_at]
            properties:
              terminal_id: { type: string, format: uuid }
              status: { $ref: '#/components/schemas/TerminalStatus' }
              status_changed_at: { type: string, format: date-time }
    Error:
      description: >-
        The request was rejected before a transaction was created (400 invalid body,
        401 not authenticated, 403 missing scope or terminal_id not matching the client
        certificate, 404 unknown terminal on a terminal path, 409 idempotency_key reused
        with a different body or a conflicting state, 422 unknown terminal or merchant
        or an unapproved device model, 5XX server error). Declines are not errors here: they
        return 201 with status FAILED and the error inside the transaction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_request:
              value:
                error_code: INVALID_REQUEST
                error_message: "amount: must be a positive integer"
                error_category: VALIDATION_ERROR
                retryable: false
            idempotency_conflict:
              value:
                error_code: IDEMPOTENCY_KEY_CONFLICT
                error_message: idempotency_key was already used with a different request body
                error_category: VALIDATION_ERROR
                retryable: false
  # Fixtures for adapter developers, contract tests and SDK docs. Each response echoes its request.
  examples:
    CardRequest:
      value:
        idempotency_key: 0b8e6c1a-4f2d-4a9e-8c3b-1d2e3f4a5b6c
        amount: 50000
        currency: INR
        payment_method: CARD
        method_details:
          encrypted_card_data: hQEMA0x7cX9Kj2Q1AQf/ZmFrZS1jaXBoZXJ0ZXh0
          card_expiry: 08/28
          cardholder_name: A Kumar
          card_network: RUPAY
        terminal_id: term_blr_001
        merchant_id: merch_1001
        customer_ref: cust_42
        capture_mode: AUTO
        description: Order 7781
        metadata: { order_id: "7781" }
        webhook_url: https://merchant.example.com/webhooks/pay
    CardSuccess:
      value:
        transaction_id: txn_01JC8Z1K2M3N4P5Q6R7S8T9V0W
        idempotency_key: 0b8e6c1a-4f2d-4a9e-8c3b-1d2e3f4a5b6c
        status: CAPTURED
        amount: 50000
        currency: INR
        payment_method: CARD
        method_reference: "431298765012"
        auth_code: "A1B2C3"
        created_at: "2026-11-07T10:00:00Z"
        updated_at: "2026-11-07T10:00:02Z"
        metadata: { order_id: "7781" }
    CardFailure:
      value:
        transaction_id: txn_01JC8Z1K2M3N4P5Q6R7S8T9V0X
        idempotency_key: 0b8e6c1a-4f2d-4a9e-8c3b-1d2e3f4a5b6c
        status: FAILED
        amount: 50000
        currency: INR
        payment_method: CARD
        method_reference: "431298765013"
        created_at: "2026-11-07T10:00:00Z"
        updated_at: "2026-11-07T10:00:02Z"
        error:
          error_code: INSUFFICIENT_FUNDS
          error_message: The issuer declined the payment for insufficient funds
          error_category: HARD_DECLINE
          retryable: false
        metadata: { order_id: "7781" }

    UpiRequest:
      value:
