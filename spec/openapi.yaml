        transitions:
          - { from: INITIATED, to: PENDING }
          - { from: PENDING, to: AUTHORIZED }
          - { from: PENDING, to: FAILED }
          - { from: AUTHORIZED, to: CAPTURED }
          - { from: AUTHORIZED, to: VOIDED }
          - { from: CAPTURED, to: SETTLED }
          - { from: CAPTURED, to: REFUNDED }
