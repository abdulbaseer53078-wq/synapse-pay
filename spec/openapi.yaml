        amount: 20000
        currency: INR
        payment_method: OFFLINE
        created_at: "2026-11-07T10:15:00Z"
        updated_at: "2026-11-07T10:15:00Z"
    OfflineFailure:
      value:
        transaction_id: txn_01JC8Z5D6E7F8G9H0J1K2L3M4P
        idempotency_key: 4f2c0a5e-8d6b-4e3c-8a7f-5b6c7d8e9f0a
        status: FAILED
        amount: 20000
        currency: INR
        payment_method: OFFLINE
        created_at: "2026-11-07T10:15:00Z"
        updated_at: "2026-11-07T11:40:00Z"
