    UpiFailure:
      value:
        transaction_id: txn_01JC8Z2A3B4C5D6E7F8G9H0J1M
        idempotency_key: 1c9f7d2b-5a3e-4b0f-9d4c-2e3f4a5b6c7d
        status: FAILED
