# promtool test rules alerts.test.yml (see README in this folder's parent, docker-compose observability profile)
rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'host_attempts_total{host="psp_1",outcome="answered"}'
        values: '0+7x15'
      - series: 'host_attempts_total{host="psp_1",outcome="failed"}'
        values: '0+3x15'
      - series: 'host_attempts_total{host="psp_2",outcome="answered"}'
        values: '0+10x15'
      - series: 'host_up{host="psp_1",rail="CARD"}'
        values: '1x15'
      - series: 'host_up{host="upi_a",rail="UPI"}'
        values: '1 1 0x13'
      - series: 'cascade_total{outcome="recovered"}'
        values: '0+9x15'
      - series: 'cascade_total{outcome="exhausted"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: AcquirerSuccessRateLow
        exp_alerts:
          - exp_labels: { severity: page, host: psp_1 }
            exp_annotations: { summary: "psp_1 answered under 80% of attempts for 5 minutes" }
      - eval_time: 12m
        alertname: AllHostsDownForRail
        exp_alerts:
          - exp_labels: { severity: page, rail: UPI }
            exp_annotations: { summary: "Every UPI host is down: that rail can't take payments" }
      - eval_time: 12m
        alertname: CascadeSuccessRateLow
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "Backups saved under 95% of failed-over payments for 5 minutes" }
  - interval: 1m
    input_series:
      - series: 'synapse_ledger_imbalance_paise{instance="api-1"}'
        values: '0 0 0 1 1'
      - series: 'synapse_ledger_imbalance_paise{instance="api-2"}'
        values: '0 0 0 1 1'
      - series: 'synapse_ledger_unbalanced_entries{instance="api-1"}'
        values: '0 0 0 0 0'
      - series: 'synapse_ledger_protection_disabled{instance="api-1",trigger="ledger_postings_append_only"}'
        values: '0 0 1 1 1'
      - series: 'synapse_stuck_transactions_current{instance="api-1",kind="pending"}'
        values: '0+3x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: LedgerImbalanceDetected
        exp_alerts: []
      - eval_time: 3m
        alertname: LedgerImbalanceDetected
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              summary: "CRITICAL: the ledger doesn't balance"
              description: "Debits and credits differ, or a write breaking that was refused. Stop and investigate before money moves further."
      - eval_time: 2m
        alertname: LedgerProtectionDisabled
        exp_alerts:
          - exp_labels: { severity: page, trigger: ledger_postings_append_only }
            exp_annotations: { summary: "CRITICAL: ledger trigger ledger_postings_append_only is disabled or missing" }
      - eval_time: 10m
        alertname: StuckTransactionsHigh
        exp_alerts:
          - exp_labels: { severity: page, kind: pending }
            exp_annotations:
              summary: "30 payments stuck pending for over 5 minutes"
              description: "The recovery sweep is behind, or a PSP or acquirer isn't answering."
