# Every test the repository has, on every push and pull request: the backend (with Postgres), the Rust crates, the
# edge node, the SDKs, the API contract and the alert rules. Nothing here is optional: a skipped financial test is
# reported, and the load test (LOAD_TEST=1) and the browser checkout test (Playwright) are the only ones left out.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres  # throwaway CI database
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: Swatinem/rust-cache@v2  # the end-to-end tests build and run the real card service
        with:
          workspaces: card-service
      - run: pip install -r backend/requirements.txt
      - name: Backend tests (unit, integration, end to end, chaos)
        working-directory: backend
        # Failures are re-printed as ::error:: annotations: they're public, unlike the job log.
        shell: bash
        run: |
          python -m pytest -q -rfEs --ignore=tests/test_checkout_browser.py | tee "$RUNNER_TEMP/pytest.out"
          rc=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " "$RUNNER_TEMP/pytest.out" | sed 's/^/::error title=backend::/' || true
          if [ "$rc" -ne 0 ]; then  # the end of the run, newlines encoded, for failures that aren't a FAILED line
            echo "::error title=backend output::$(tail -n 40 "$RUNNER_TEMP/pytest.out" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$rc"

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:  # card-service's vault store test runs against a real database
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        crate: [iso8583, host-connector, card-service]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Tests
        working-directory: ${{ matrix.crate }}
        shell: bash
        run: |
          cargo test 2>&1 | tee "$RUNNER_TEMP/cargo.out"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then  # panics and failed test names, public as annotations
            grep -E "panicked at|^test .* FAILED|^---- " "$RUNNER_TEMP/cargo.out" | head -20 | sed 's/^/::error title=${{ matrix.crate }}::/'
          fi
          exit "$rc"
      - name: Clippy (warnings are errors)
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --all-targets -- -D warnings

  edge-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: edge-node/requirements.txt
      - run: pip install -r edge-node/requirements.txt
      - working-directory: edge-node
        run: python -m pytest -q

  sdks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Terminal transport (Java 8 build, chaos and mesh tests)
        working-directory: sdks/terminal-transport
        shell: bash
        run: |
          sh run-tests.sh 2>&1 | tee "$RUNNER_TEMP/terminal.out"
          rc=${PIPESTATUS[0]}
          grep -A1 -E "^FAIL|error:" "$RUNNER_TEMP/terminal.out" | sed 's/^/::error title=terminal-transport::/' || true
          exit "$rc"
      - name: Node SDK
        working-directory: sdks/node
        run: npm ci && npm test
      - name: Web SDK
        working-directory: sdks/web
        run: npm ci && npm test

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r spec/requirements.txt
      - name: Spec examples and rules
        run: python spec/check_spec.py
      - name: Spec lint
        run: npx --yes @redocly/cli@1.34.0 lint spec/openapi.yaml
      - name: Alert rules (promtool)
        run: >-
          docker run --rm -v "$PWD/observability:/w" -w /w --entrypoint promtool prom/prometheus:v3.5.0
          test rules alerts.test.yml
