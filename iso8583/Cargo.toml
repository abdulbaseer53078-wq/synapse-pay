[package]
name = "iso8583"
version = "1.1.0"
edition = "2024"
rust-version = "1.87"
description = "ISO 8583 message parsing and building, with per-host JSON dialect dictionaries"
repository = "https://github.com/abdulbaseer53078-wq/synapse-pay"
readme = "README.md"
publish = false  # internal: consumed as a git dependency on the iso8583-v* tags

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
proptest = "1"
