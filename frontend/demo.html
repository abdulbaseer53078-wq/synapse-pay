<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse Checkout — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      margin: 0;
    }
    .demo-card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 400px;
      width: 90vw;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      text-align: center;
    }
    .demo-card h1 { font-size: 22px; margin: 0 0 8px; color: #111; }
    .demo-card p  { color: #666; margin: 0 0 32px; font-size: 15px; }
    .pay-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 36px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .pay-btn:hover { background: #4338ca; }
    .pay-btn:disabled { background: #a5b4fc; cursor: default; }
    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
      min-height: 20px;
    }
  </style>
</head>
<body>

<div class="demo-card">
  <h1>Demo Shop</h1>
  <p>Order total: <strong>₹500.00</strong></p>
  <button class="pay-btn" id="pay-btn">Pay ₹500</button>
  <div id="status"></div>
</div>

<script src="synapse.js"></script>
<script>
  /*
   * BACKEND_URL — change if your FastAPI server is on a different host/port.
   * API_KEY     — replace with a real sk_live_... key from POST /api/v1/api-keys.
   *               In production the merchant server creates the session server-side;
   *               never expose a live API key in client-side JS.
   */
  const BACKEND_URL = "http://localhost:8000";
  const API_KEY     = "sk_live_REPLACE_WITH_REAL_KEY";

  const statusEl = document.getElementById("status");
  const payBtn   = document.getElementById("pay-btn");

  payBtn.addEventListener("click", async () => {
    payBtn.disabled = true;
    statusEl.textContent = "Creating checkout session…";

    try {
      // Step 1: fetch the card-service's RSA public key (JWK).
      const keyRes = await fetch(`${BACKEND_URL}/api/v1/checkout/key`);
      if (!keyRes.ok) {
        statusEl.textContent = "Could not fetch checkout key — is the card-service running?";
        payBtn.disabled = false;
        return;
      }
      const publicKey = await keyRes.json();

      // Step 2: ask the backend to create a checkout session.
      const res = await fetch(`${BACKEND_URL}/api/v1/checkout/sessions`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${API_KEY}`,
        },
        body: JSON.stringify({
          amount: 50000,          // ₹500.00 in minor units
          currency: "INR",
          description: "Demo order",
          success_url: window.location.origin + "?payment=success",
          cancel_url:  window.location.origin + "?payment=cancelled",
        }),
      });

      if (!res.ok) {
        const err = await res.json();
        statusEl.textContent = "Could not create session: " + (err.error_message || res.status);
        payBtn.disabled = false;
        return;
      }

      const session = await res.json();
      statusEl.textContent = "Session created — opening checkout…";

      // Step 3: open the SDK modal. POSTs encrypted card data to the backend pay endpoint.
      const payUrl = `${BACKEND_URL}/api/v1/checkout/sessions/${session.session_id}/pay`;
      await SynapseCheckout.open(payUrl, publicKey);

    } catch (err) {
      statusEl.textContent = "Network error — is the backend running on " + BACKEND_URL + "?";
      console.error("[Demo] Error:", err.message);
    } finally {
      payBtn.disabled = false;
    }
  });

  // Show result if redirected back from success/cancel URL.
  const params = new URLSearchParams(window.location.search);
  if (params.get("payment") === "success")    statusEl.textContent = "✓ Payment successful!";
  if (params.get("payment") === "cancelled")  statusEl.textContent = "Payment cancelled.";
</script>

</body>
</html>
