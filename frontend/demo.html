<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse Checkout — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      margin: 0;
    }
    .demo-card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 400px;
      width: 90vw;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      text-align: center;
    }
    .demo-card h1 { font-size: 22px; margin: 0 0 8px; color: #111; }
    .demo-card p  { color: #666; margin: 0 0 32px; font-size: 15px; }
    .pay-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 36px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .pay-btn:hover { background: #4338ca; }
    .pay-btn:disabled { background: #a5b4fc; cursor: default; }
    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
      min-height: 20px;
    }
  </style>
</head>
<body>

<div class="demo-card">
  <h1>Demo Shop</h1>
  <p>Order total: <strong>₹500.00</strong></p>
  <button class="pay-btn" id="pay-btn">Pay ₹500</button>
  <div id="status"></div>
</div>

<script src="synapse.js"></script>
<script>
  /*
   * SANDBOX KEY — replace with the real RSA public key from your backend before going live.
   * In production, fetch this from GET /api/v1/checkout/sessions/{id} or a dedicated key endpoint.
   *
   * To generate a test key pair locally:
   *   openssl genrsa -out private.pem 2048
   *   openssl rsa -in private.pem -pubout -out public.pem
   * Then paste public.pem below.
   */
  const SANDBOX_PUBLIC_KEY = `-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA2a2rwplBQLF29amygykE
MmYz0+Kcj3bKBp29gNNBxEBXMPB0c/MFPFNpFHZCTF6+vVbUzSE5fAnk5nVLn5
NFXN0LmHfBVHJGCBVFfKMSqfSUWXN3nFfZrCJRbMIRW7MlhKtBWAHXFe1B7qRW
YHDq8FZgMR0Y1CIRzSMzOLQ1u7ggvbR0nfhgMBxpYZlBGhK1Ldc8AAAAAAAAAAA
AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAB
-----END PUBLIC KEY-----`;

  const statusEl = document.getElementById("status");
  const payBtn   = document.getElementById("pay-btn");

  payBtn.addEventListener("click", async () => {
    payBtn.disabled = true;
    statusEl.textContent = "Creating checkout session…";

    try {
      /*
       * Step 1: ask the backend to create a session.
       * Replace the Authorization header value with a real sk_live_... key.
       * In production, the merchant server creates the session server-side and passes
       * checkout_url to the browser — never expose the API key in client-side JS.
       */
      const res = await fetch("/api/v1/checkout/sessions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer sk_live_REPLACE_WITH_REAL_KEY",
        },
        body: JSON.stringify({
          amount: 50000,          // ₹500.00 in minor units
          currency: "INR",
          description: "Demo order",
          success_url: window.location.origin + "?payment=success",
          cancel_url:  window.location.origin + "?payment=cancelled",
        }),
      });

      if (!res.ok) {
        const err = await res.json();
        statusEl.textContent = "Could not create session: " + (err.error_message || res.status);
        payBtn.disabled = false;
        return;
      }

      const session = await res.json();
      statusEl.textContent = "Session created — opening checkout…";

      // Step 2: open the modal with the session URL and the RSA public key.
      await SynapseCheckout.open(session.checkout_url, SANDBOX_PUBLIC_KEY);

    } catch (err) {
      statusEl.textContent = "Network error — is the backend running?";
      console.error("[Demo] Session creation failed:", err.message);
    } finally {
      payBtn.disabled = false;
    }
  });

  // Show result if redirected back from success/cancel URL.
  const params = new URLSearchParams(window.location.search);
  if (params.get("payment") === "success")    statusEl.textContent = "✓ Payment successful!";
  if (params.get("payment") === "cancelled")  statusEl.textContent = "Payment cancelled.";
</script>

</body>
</html>
