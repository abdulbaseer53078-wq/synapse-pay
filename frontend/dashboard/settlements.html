<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settlements · Synapse Pay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] } } } };</script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased">

<div id="sidebar-mount"></div>
<main class="md:ml-60">
  <div class="mx-auto max-w-5xl px-4 py-8 md:px-10">
    <header class="mb-6">
      <h1 class="text-xl font-semibold tracking-tight">Settlements</h1>
      <p class="mt-1 text-sm text-slate-500">Every batch paid to your bank account, with MDR and GST itemised.</p>
    </header>

    <div id="err-banner" class="mb-4 hidden rounded-md border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
      Settlements are only visible with a <code class="font-mono">sk_live_</code> key. Sign out and sign in with your live key.
    </div>

    <div class="overflow-x-auto rounded-lg border border-slate-200 bg-white">
      <table class="w-full text-sm">
        <thead class="border-b border-slate-200 text-xs text-slate-500">
          <tr>
            <th class="px-4 py-2.5 text-left font-medium">Settled on</th>
            <th class="px-4 py-2.5 text-left font-medium">Currency</th>
            <th class="px-4 py-2.5 text-right font-medium">Gross</th>
            <th class="px-4 py-2.5 text-right font-medium">MDR</th>
            <th class="px-4 py-2.5 text-right font-medium">GST</th>
            <th class="px-4 py-2.5 text-right font-medium">Net</th>
          </tr>
        </thead>
        <tbody id="tbody" class="divide-y divide-slate-100">
          <tr><td colspan="6" class="px-4 py-10 text-center text-slate-400">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="_nav.js"></script>
<script>
  requireAuth();
  renderSidebar("settlements.html");

  async function load() {
    const res = await apiFetch("/api/v1/settlements?limit=200");
    const tbody = document.getElementById("tbody");

    if (!res || !res.ok) {
      document.getElementById("err-banner").classList.remove("hidden");
      tbody.innerHTML = emptyRow(6, "settlements", "Settlements unavailable", "Your current key can't read settlement data.");
      return;
    }

    const { items } = await res.json();
    if (!items.length) {
      tbody.innerHTML = emptyRow(6, "settlements", "No settlements yet",
        "Captured payments are batched and settled daily. Your first payout will appear here.");
      return;
    }

    tbody.innerHTML = items.map(s => `
      <tr class="hover:bg-slate-50">
        <td class="whitespace-nowrap px-4 py-3 text-slate-700">${fmtDate(s.settled_at)}</td>
        <td class="px-4 py-3 text-slate-500">${esc(s.currency)}</td>
        <td class="px-4 py-3 text-right tabular-nums">${fmt(s.gross_amount, s.currency)}</td>
        <td class="px-4 py-3 text-right tabular-nums text-slate-500">${fmt(s.mdr_fee, s.currency)}</td>
        <td class="px-4 py-3 text-right tabular-nums text-slate-500">${fmt(s.gst_on_fee, s.currency)}</td>
        <td class="px-4 py-3 text-right font-medium tabular-nums">${fmt(s.net_amount, s.currency)}</td>
      </tr>`).join("");
  }

  load();
</script>
</body>
</html>
