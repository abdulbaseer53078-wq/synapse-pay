<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse Pay — Settlements</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="flex min-h-screen">
  <div id="sidebar-mount"></div>
  <main class="ml-56 flex-1 p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Settlements</h1>

    <div id="err-banner" class="hidden mb-4 p-4 bg-amber-50 border border-amber-200 rounded-lg text-sm text-amber-800">
      Settlements require a <code class="font-mono">sk_live_</code> key. Sign in with your live key to view this page.
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-100">
          <tr>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Date</th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Currency</th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Gross</th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">MDR</th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">GST</th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Net</th>
          </tr>
        </thead>
        <tbody id="tbody" class="divide-y divide-gray-50">
          <tr><td colspan="6" class="text-center py-8 text-gray-400">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="_nav.js"></script>
<script>
  requireAuth();
  renderSidebar("settlements.html");

  async function load() {
    const res = await apiFetch("/api/v1/settlements?limit=200");
    const tbody = document.getElementById("tbody");

    if (!res || !res.ok) {
      document.getElementById("err-banner").classList.remove("hidden");
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-400">No data available.</td></tr>`;
      return;
    }

    const { items } = await res.json();
    if (!items.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-400">No settlements yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = items.map(s => `
      <tr class="hover:bg-gray-50">
        <td class="px-4 py-3 text-gray-700">${new Date(s.settled_at).toLocaleDateString("en-IN")}</td>
        <td class="px-4 py-3 text-gray-700">${s.currency}</td>
        <td class="px-4 py-3 text-right text-gray-900 font-mono">${fmt(s.gross_amount, s.currency)}</td>
        <td class="px-4 py-3 text-right text-gray-500 font-mono">${fmt(s.mdr_fee, s.currency)}</td>
        <td class="px-4 py-3 text-right text-gray-500 font-mono">${fmt(s.gst_on_fee, s.currency)}</td>
        <td class="px-4 py-3 text-right text-green-700 font-mono font-medium">${fmt(s.net_amount, s.currency)}</td>
      </tr>`).join("");
  }

  load();
</script>
</body>
</html>
