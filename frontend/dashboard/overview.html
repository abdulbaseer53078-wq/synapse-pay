<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview · Synapse Pay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] } } } };</script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased">

<div id="sidebar-mount"></div>
<main class="md:ml-60">
  <div class="mx-auto max-w-5xl px-4 py-8 md:px-10">
    <header class="mb-6">
      <h1 class="text-xl font-semibold tracking-tight">Overview</h1>
      <p class="mt-1 text-sm text-slate-500">Settled volume and account health at a glance.</p>
    </header>

    <div class="grid grid-cols-1 gap-px overflow-hidden rounded-lg border border-slate-200 bg-slate-200 sm:grid-cols-2 lg:grid-cols-4">
      <div class="bg-white p-5">
        <div class="text-sm text-slate-500">Gross volume settled</div>
        <div id="stat-gross" class="mt-2 text-2xl font-semibold tabular-nums">—</div>
      </div>
      <div class="bg-white p-5">
        <div class="text-sm text-slate-500">Net paid out</div>
        <div id="stat-net" class="mt-2 text-2xl font-semibold tabular-nums">—</div>
        <div class="mt-1 text-xs text-slate-400">After MDR and GST</div>
      </div>
      <div class="bg-white p-5">
        <div class="text-sm text-slate-500">Open risk holds</div>
        <div id="stat-holds" class="mt-2 text-2xl font-semibold tabular-nums">—</div>
      </div>
      <div class="bg-white p-5">
        <div class="text-sm text-slate-500">Active API keys</div>
        <div id="stat-keys" class="mt-2 text-2xl font-semibold tabular-nums">—</div>
      </div>
    </div>

    <p id="note" class="mt-4 hidden text-sm text-slate-500">
      Settlement and risk figures are only available with a <code class="rounded bg-slate-100 px-1 font-mono text-xs">sk_live_</code> key.
    </p>
  </div>
</main>

<script src="_nav.js"></script>
<script>
  requireAuth();
  renderSidebar("overview.html");

  function totals(items, field) {
    const byCur = {};
    items.forEach(s => { byCur[s.currency] = (byCur[s.currency] || 0) + s[field]; });
    const parts = Object.entries(byCur).map(([cur, v]) => fmt(v, cur));
    return parts.length ? parts.join(" · ") : fmt(0);
  }

  async function load() {
    const [keysRes, settlRes, riskRes] = await Promise.all([
      apiFetch("/api/v1/api-keys"),
      apiFetch("/api/v1/settlements?limit=200"),
      apiFetch("/api/v1/risk-status"),
    ]);

    if (keysRes && keysRes.ok) {
      const { items } = await keysRes.json();
      document.getElementById("stat-keys").textContent = items.filter(k => !k.revoked_at).length;
    }

    if (settlRes && settlRes.ok) {
      const { items } = await settlRes.json();
      document.getElementById("stat-gross").textContent = totals(items, "gross_amount");
      document.getElementById("stat-net").textContent = totals(items, "net_amount");
    } else {
      document.getElementById("note").classList.remove("hidden");
    }

    if (riskRes && riskRes.ok) {
      const { holds } = await riskRes.json();
      document.getElementById("stat-holds").textContent = holds.length;
    }
  }

  load();
</script>
</body>
</html>
