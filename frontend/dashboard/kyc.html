<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business verification · Synapse Pay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] } } } };</script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased">

<div id="sidebar-mount"></div>
<main class="md:ml-60">
  <div class="mx-auto max-w-5xl px-4 py-8 md:px-10">
    <header class="mb-6">
      <h1 class="text-xl font-semibold tracking-tight">Business verification</h1>
      <p class="mt-1 text-sm text-slate-500">We verify your PAN and GSTIN before you can accept live payments.</p>
    </header>

    <div id="banner" class="mb-4 hidden max-w-lg rounded-md border px-4 py-3 text-sm"></div>

    <div class="max-w-lg rounded-lg border border-slate-200 bg-white p-6">
      <form id="kyc-form" class="space-y-5">
        <div>
          <label for="pan" class="mb-1.5 block text-sm font-medium text-slate-700">PAN</label>
          <input type="text" id="pan" placeholder="AAACA1234Q" maxlength="10" required
                 class="w-full rounded-md border border-slate-300 px-3 py-2 font-mono text-sm uppercase outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20">
          <p class="mt-1 text-xs text-slate-500">10 characters: 5 letters, 4 digits, 1 letter.</p>
        </div>
        <div>
          <label for="gst" class="mb-1.5 block text-sm font-medium text-slate-700">GSTIN</label>
          <input type="text" id="gst" placeholder="29AAACA1234Q1Z5" maxlength="15" required
                 class="w-full rounded-md border border-slate-300 px-3 py-2 font-mono text-sm uppercase outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20">
          <p class="mt-1 text-xs text-slate-500">15 characters, starting with your state code.</p>
        </div>
        <button type="submit"
                class="w-full rounded-md bg-blue-600 py-2 text-sm font-medium text-white hover:bg-blue-700 disabled:opacity-50">
          Submit for review
        </button>
      </form>

      <p id="msg" class="mt-3 min-h-5 text-sm text-slate-500" role="status"></p>
    </div>
  </div>
</main>

<script src="_nav.js"></script>
<script>
  requireAuth();
  renderSidebar("kyc.html");

  ["pan", "gst"].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener("input", () => { el.value = el.value.toUpperCase(); });
  });

  const BANNERS = {
    APPROVED: ["border-emerald-200 bg-emerald-50 text-emerald-800", "Verified. You can create live API keys."],
    PENDING: ["border-blue-200 bg-blue-50 text-blue-800", "Under review. We usually respond within one business day."],
    REJECTED: ["border-red-200 bg-red-50 text-red-800", "We couldn't verify these details. Check them and resubmit."],
    NONE: ["border-amber-200 bg-amber-50 text-amber-800", "Not submitted yet. Test keys work now; live keys unlock after verification."],
  };

  function showBanner(status) {
    const [cls, text] = BANNERS[status] || BANNERS.NONE;
    const el = document.getElementById("banner");
    el.className = `mb-4 max-w-lg rounded-md border px-4 py-3 text-sm ${cls}`;
    el.textContent = text;
  }

  async function loadStatus() {
    const res = await apiFetch("/api/v1/kyc/status");
    if (res && res.ok) {
      const { status } = await res.json();
      showBanner(status);
    }
  }

  document.getElementById("kyc-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    const msg = document.getElementById("msg");
    btn.disabled = true;
    msg.textContent = "Submitting…";

    const res = await apiFetch("/api/v1/kyc/submit", {
      method: "POST",
      body: JSON.stringify({
        pan_number: document.getElementById("pan").value.trim(),
        gst_number: document.getElementById("gst").value.trim(),
      }),
    });

    if (!res) {
      msg.textContent = "Can't reach the server.";
    } else if (res.ok) {
      msg.textContent = "";
      showBanner("PENDING");
    } else {
      const data = await res.json().catch(() => ({}));
      msg.textContent = data.error_message || `Submission failed (${res.status}).`;
    }
    btn.disabled = false;
  });

  loadStatus();
</script>
</body>
</html>
