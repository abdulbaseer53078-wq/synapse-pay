<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse Pay — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-6">

<div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-8">
  <div class="mb-6">
    <h1 class="text-xl font-bold text-gray-900">Synapse Pay</h1>
    <p class="text-sm text-gray-500 mt-1">Enter your API key to sign in.</p>
  </div>

  <form id="login-form">
    <label class="block text-sm font-medium text-gray-700 mb-1.5">API Key</label>
    <input id="api-key" type="password" placeholder="sk_live_… or sk_test_…"
           autocomplete="off"
           class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
    <button type="submit"
            class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition-colors">
      Sign In
    </button>
  </form>

  <p id="err" class="mt-3 text-sm text-red-600 hidden"></p>
</div>

<script src="_nav.js"></script>
<script>
  // Already logged in? Skip login.
  if (getKey()) location.href = "overview.html";

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const key = document.getElementById("api-key").value.trim();
    if (!key) return;
    const btn = e.target.querySelector("button");
    const err = document.getElementById("err");
    btn.disabled = true;
    btn.textContent = "Verifying…";
    err.classList.add("hidden");

    // Validate by calling the API keys list — accepts any valid sk_ key.
    const res = await fetch(`${BACKEND_URL}/api/v1/api-keys`, {
      headers: { "Authorization": `Bearer ${key}` },
    }).catch(() => null);

    if (res && res.ok) {
      setKey(key);
      location.href = "overview.html";
    } else {
      err.textContent = res ? "Invalid or revoked API key." : "Cannot reach the backend. Is it running?";
      err.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "Sign In";
    }
  });
</script>
</body>
</html>
