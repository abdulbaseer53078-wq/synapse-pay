<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Synapse Pay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] } } } };</script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 p-4 font-sans text-slate-900 antialiased">

<div class="w-full max-w-sm">
  <div class="mb-6 flex items-center gap-2">
    <div class="flex h-7 w-7 items-center justify-center rounded-md bg-slate-900 text-xs font-semibold text-white">S</div>
    <span class="text-sm font-semibold">Synapse Pay</span>
  </div>

  <div class="rounded-lg border border-slate-200 bg-white p-6">
    <h1 class="text-lg font-semibold tracking-tight">Sign in to your dashboard</h1>
    <p class="mt-1 text-sm text-slate-500">Use a secret key from your account. Test keys show sandbox data only.</p>

    <form id="login-form" class="mt-5">
      <label for="api-key" class="mb-1.5 block text-sm font-medium text-slate-700">Secret key</label>
      <input id="api-key" type="password" placeholder="sk_test_…" autocomplete="off"
             class="w-full rounded-md border border-slate-300 px-3 py-2 font-mono text-sm outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20">
      <button type="submit"
              class="mt-4 w-full rounded-md bg-blue-600 py-2 text-sm font-medium text-white hover:bg-blue-700 disabled:opacity-50">
        Sign in
      </button>
    </form>

    <p id="err" class="mt-3 hidden text-sm text-red-600" role="alert"></p>
  </div>
</div>

<script src="_nav.js"></script>
<script>
  if (getKey()) location.href = "overview.html";

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const key = document.getElementById("api-key").value.trim();
    if (!key) return;
    const btn = e.target.querySelector("button");
    const err = document.getElementById("err");
    btn.disabled = true;
    btn.textContent = "Verifying…";
    err.classList.add("hidden");

    const res = await fetch(`${BACKEND_URL}/api/v1/api-keys`, {
      headers: { "Authorization": `Bearer ${key}` },
    }).catch(() => null);

    if (res && res.ok) {
      setKey(key);
      location.href = "overview.html";
    } else {
      err.textContent = res ? "That key is invalid or has been revoked." : "Can't reach the server. Is the backend running on :8000?";
      err.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
