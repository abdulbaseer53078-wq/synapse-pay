<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse Pay — Risk Holds</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="flex min-h-screen">
  <div id="sidebar-mount"></div>
  <main class="ml-56 flex-1 p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Risk Holds</h1>

    <div id="err-banner" class="hidden mb-4 p-4 bg-amber-50 border border-amber-200 rounded-lg text-sm text-amber-800">
      Risk holds require a <code class="font-mono">sk_live_</code> key.
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-100">
          <tr>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Date</th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Reason</th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Status</th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Required Documents</th>
          </tr>
        </thead>
        <tbody id="tbody" class="divide-y divide-gray-50">
          <tr><td colspan="4" class="text-center py-8 text-gray-400">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="_nav.js"></script>
<script>
  requireAuth();
  renderSidebar("risk.html");

  const STATUS_COLORS = {
    OPEN: "bg-red-100 text-red-700",
    REVIEWING: "bg-yellow-100 text-yellow-700",
    RESOLVED: "bg-green-100 text-green-700",
  };

  async function load() {
    const res = await apiFetch("/api/v1/risk-status");
    const tbody = document.getElementById("tbody");

    if (!res || !res.ok) {
      document.getElementById("err-banner").classList.remove("hidden");
      tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-gray-400">No data available.</td></tr>`;
      return;
    }

    const { holds } = await res.json();
    if (!holds.length) {
      tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-gray-400">No open risk holds.</td></tr>`;
      return;
    }

    tbody.innerHTML = holds.map(h => {
      const badge = STATUS_COLORS[h.status] || "bg-gray-100 text-gray-700";
      const docs = (h.required_documents || []).join(", ") || "—";
      return `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-3 text-gray-700">${new Date(h.created_at).toLocaleDateString("en-IN")}</td>
          <td class="px-4 py-3 text-gray-900">${h.reason}</td>
          <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs font-medium ${badge}">${h.status}</span></td>
          <td class="px-4 py-3 text-gray-500">${docs}</td>
        </tr>`;
    }).join("");
  }

  load();
</script>
</body>
</html>
