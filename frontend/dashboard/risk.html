<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk holds · Synapse Pay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] } } } };</script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased">

<div id="sidebar-mount"></div>
<main class="md:ml-60">
  <div class="mx-auto max-w-5xl px-4 py-8 md:px-10">
    <header class="mb-6">
      <h1 class="text-xl font-semibold tracking-tight">Risk holds</h1>
      <p class="mt-1 text-sm text-slate-500">Payouts paused for review, and the documents needed to release them.</p>
    </header>

    <div id="err-banner" class="mb-4 hidden rounded-md border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
      Risk holds are only visible with a <code class="font-mono">sk_live_</code> key.
    </div>

    <div class="overflow-x-auto rounded-lg border border-slate-200 bg-white">
      <table class="w-full text-sm">
        <thead class="border-b border-slate-200 text-xs text-slate-500">
          <tr>
            <th class="px-4 py-2.5 text-left font-medium">Opened</th>
            <th class="px-4 py-2.5 text-left font-medium">Reason</th>
            <th class="px-4 py-2.5 text-left font-medium">Status</th>
            <th class="px-4 py-2.5 text-left font-medium">Documents required</th>
          </tr>
        </thead>
        <tbody id="tbody" class="divide-y divide-slate-100">
          <tr><td colspan="4" class="px-4 py-10 text-center text-slate-400">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="_nav.js"></script>
<script>
  requireAuth();
  renderSidebar("risk.html");

  const STATUS_COLORS = {
    OPEN: "bg-red-50 text-red-700",
    REVIEWING: "bg-amber-50 text-amber-700",
    RESOLVED: "bg-emerald-50 text-emerald-700",
  };

  async function load() {
    const res = await apiFetch("/api/v1/risk-status");
    const tbody = document.getElementById("tbody");

    if (!res || !res.ok) {
      document.getElementById("err-banner").classList.remove("hidden");
      tbody.innerHTML = emptyRow(4, "risk", "Risk holds unavailable", "Your current key can't read risk data.");
      return;
    }

    const { holds } = await res.json();
    if (!holds.length) {
      tbody.innerHTML = emptyRow(4, "risk", "No open holds", "All payouts are flowing normally.");
      return;
    }

    tbody.innerHTML = holds.map(h => {
      const badge = STATUS_COLORS[h.status] || "bg-slate-100 text-slate-600";
      const docs = (h.required_documents || []).map(esc).join(", ") || "—";
      return `
        <tr class="hover:bg-slate-50">
          <td class="whitespace-nowrap px-4 py-3 text-slate-700">${fmtDate(h.created_at)}</td>
          <td class="px-4 py-3">${esc(h.reason)}</td>
          <td class="px-4 py-3"><span class="rounded px-1.5 py-0.5 text-xs font-medium ${badge}">${esc(h.status)}</span></td>
          <td class="px-4 py-3 text-slate-500">${docs}</td>
        </tr>`;
    }).join("");
  }

  load();
</script>
</body>
</html>
